name: Inspect or submit Dalilna Google Play changes

on:
  workflow_dispatch:
    inputs:
      confirm_target:
        description: "Confirm the fixed Dalilna package only"
        required: true
        type: choice
        options:
          - "NO — validation only"
          - "YES — ye.dalilna.app only"
        default: "NO — validation only"
      mode:
        description: "Inspection reads only. Staging writes into the existing edit without committing. Submission sends all changes to Google review."
        required: true
        type: choice
        options:
          - INSPECT_ONLY
          - STAGE_ONLY
          - SUBMIT_FOR_REVIEW
          - PUBLISH_CLOSED_TESTING
        default: INSPECT_ONLY
      existing_edit_id:
        description: "Read-only inspection only. Stage Only always creates a fresh isolated edit and rejects a supplied ID."
        required: false
        type: string
        default: ""
      testers_google_group:
        description: "Optional Google Groups email to add on review submission; saved individual email lists are not exposed by the API"
        required: false
        type: string

  push:
    branches: [main]
    paths:
      - ".github/workflows/google-play-closed-testing-draft.yml"
      - "scripts/google_play_closed_testing_draft.py"

permissions:
  contents: read
  id-token: write

concurrency:
  group: dalilna-google-play-state
  cancel-in-progress: false

jobs:
  play:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       inputs.confirm_target == 'YES — ye.dalilna.app only') ||
      (github.event_name == 'push' &&
       (contains(github.event.head_commit.message || '', '[inspect-dalilna-play-state]') ||
        contains(github.event.head_commit.message || '', '[stage-dalilna-play-edit]') ||
        contains(github.event.head_commit.message || '', '[submit-dalilna-closed-testing]') ||
        contains(github.event.head_commit.message || '', '[publish-dalilna-closed-testing]')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PACKAGE_NAME: ye.dalilna.app
      EXPECTED_VERSION_CODE: "4128701"
      PLAY_TRACK_NAME: Dalilna Closed Testing
      TESTERS_GOOGLE_GROUP: ${{ inputs.testers_google_group }}
      PLAY_MODE: ${{ inputs.mode || (contains(github.event.head_commit.message || '', '[publish-dalilna-closed-testing]') && 'PUBLISH_CLOSED_TESTING') || (contains(github.event.head_commit.message || '', '[submit-dalilna-closed-testing]') && 'SUBMIT_FOR_REVIEW') || (contains(github.event.head_commit.message || '', '[stage-dalilna-play-edit]') && 'STAGE_ONLY') || 'INSPECT_ONLY' }}
      GITHUB_EVENT_NAME: ${{ github.event_name }}
      GITHUB_EVENT_HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
      EXISTING_EDIT_ID: ${{ inputs.existing_edit_id || '' }}
    steps:
      - name: Checkout Dalilna main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate repository and target scope
        shell: bash
        env:
          WIF_PROVIDER: projects/28058491662/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          WIF_SERVICE_ACCOUNT: dalilna-play-automation@dalilna-play-automation-516000.iam.gserviceaccount.com
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "baraagpt6-droid/dalilna" ]]
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$PACKAGE_NAME" == "ye.dalilna.app" ]]
          [[ "$EXPECTED_VERSION_CODE" == "4128701" ]]
          [[ "$PLAY_TRACK_NAME" == "Dalilna Closed Testing" ]]
          [[ -n "$WIF_PROVIDER" && -n "$WIF_SERVICE_ACCOUNT" ]]
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            if [[ "$GITHUB_EVENT_HEAD_COMMIT_MESSAGE" == *"[publish-dalilna-closed-testing]"* ]]; then
              [[ "$PLAY_MODE" == "PUBLISH_CLOSED_TESTING" ]]
              [[ "$PACKAGE_NAME" == "ye.dalilna.app" ]]
              [[ "$PLAY_TRACK_NAME" == "Dalilna Closed Testing" ]]
              echo "Explicit marker enables closed-track promotion only for Dalilna."
            elif [[ "$GITHUB_EVENT_HEAD_COMMIT_MESSAGE" == *"[submit-dalilna-closed-testing]"* ]]; then
              [[ "$PLAY_MODE" == "SUBMIT_FOR_REVIEW" ]]
              [[ "$PACKAGE_NAME" == "ye.dalilna.app" ]]
              [[ "$PLAY_TRACK_NAME" == "Dalilna Closed Testing" ]]
              echo "Explicit marker enables draft Closed Testing review submission only."
            elif [[ "$GITHUB_EVENT_HEAD_COMMIT_MESSAGE" == *"[stage-dalilna-play-edit]"* ]]; then
              [[ "$PLAY_MODE" == "STAGE_ONLY" ]]
              echo "Explicit push marker enables STAGE_ONLY for ye.dalilna.app."
            else
              [[ "$GITHUB_EVENT_HEAD_COMMIT_MESSAGE" == *"[inspect-dalilna-play-state]"* ]]
              [[ "$PLAY_MODE" == "INSPECT_ONLY" ]]
              echo "Push mode is strictly read-only inspection."
            fi
          else
            [[ "$PLAY_MODE" == "INSPECT_ONLY" || "$PLAY_MODE" == "STAGE_ONLY" || "$PLAY_MODE" == "SUBMIT_FOR_REVIEW" || "$PLAY_MODE" == "PUBLISH_CLOSED_TESTING" ]]
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Google API and image dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "google-auth>=2.40,<3" "requests>=2.32,<3" "Pillow>=11,<13" "CairoSVG>=2.8,<3"

      - name: Run offline Play automation safety tests
        run: python scripts/test_google_play_closed_testing_draft.py

      - name: Authenticate to Google Cloud using GitHub OIDC
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: "projects/28058491662/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "dalilna-play-automation@dalilna-play-automation-516000.iam.gserviceaccount.com"
          create_credentials_file: true
          export_environment_variables: true

      - name: Read current Play state without changing it
        if: env.PLAY_MODE == 'INSPECT_ONLY'
        shell: bash
        run: |
          set -euo pipefail
          ARGS=(--inspect-only)
          if [[ -n "$EXISTING_EDIT_ID" ]]; then
            ARGS+=(--existing-edit-id "$EXISTING_EDIT_ID")
          fi
          python scripts/google_play_closed_testing_draft.py "${ARGS[@]}"

      - name: Read committed Play state before isolated Stage Only
        if: env.PLAY_MODE == 'STAGE_ONLY'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/google_play_closed_testing_draft.py --inspect-only

      - name: Promote the reviewed Dalilna Closed Testing draft only
        if: env.PLAY_MODE == 'PUBLISH_CLOSED_TESTING'
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PACKAGE_NAME" == "ye.dalilna.app" ]]
          [[ "$PLAY_TRACK_NAME" == "Dalilna Closed Testing" ]]
          python scripts/google_play_closed_testing_draft.py --publish-closed-testing

      - name: Read committed Play state before Closed Testing submission
        if: env.PLAY_MODE == 'SUBMIT_FOR_REVIEW'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/google_play_closed_testing_draft.py --inspect-only

      - name: Download pinned signed Dalilna AAB
        if: env.PLAY_MODE == 'STAGE_ONLY' || env.PLAY_MODE == 'SUBMIT_FOR_REVIEW'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/aab dist/play-assets
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://github.com/baraagpt6-droid/dalilna/releases/download/v3.1.0/app-release.aab" \
            --output dist/aab/app-release.aab
          echo "6e70daa8cdbdd93f9ce069223514bfb5129e2b462e9ff278f9cd91ef7ae24ca0  dist/aab/app-release.aab" | sha256sum --check

      - name: Set up Node.js for fresh Play screenshots
        if: env.PLAY_MODE == 'SUBMIT_FOR_REVIEW'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Capture and prepare Play listing images
        if: env.PLAY_MODE == 'SUBMIT_FOR_REVIEW'
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.65.1
          npx playwright install --with-deps chromium
          mkdir -p dist/google-play-screenshots
          cat scripts/gp-capture-a.part scripts/gp-capture-b2.part scripts/gp-capture-c.part scripts/gp-capture-d.part scripts/gp-capture-d2.part > scripts/capture.cjs
          node scripts/capture.cjs
          (cd dist && zip -r dalilna-play-screenshots.zip google-play-screenshots)
          python scripts/prepare_google_play_assets.py \
            --screenshots-zip dist/dalilna-play-screenshots.zip \
            --output-dir dist/play-assets

      - name: Stage only the Dalilna bundle and Closed Testing track
        id: stage_play
        if: env.PLAY_MODE == 'STAGE_ONLY'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$EXISTING_EDIT_ID" ]]; then
            echo "::error::STAGE_ONLY does not reuse an existing Edit ID. Leave the field blank."
            exit 1
          fi
          python scripts/google_play_closed_testing_draft.py \
            --stage-only \
            --aab dist/aab/app-release.aab \
            --github-output "$GITHUB_OUTPUT"

      - name: Verify staged Play edit with read-only API inspection
        if: env.PLAY_MODE == 'STAGE_ONLY'
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${{ steps.stage_play.outputs.edit_id }}" ]]
          python scripts/google_play_closed_testing_draft.py \
            --inspect-only \
            --existing-edit-id "${{ steps.stage_play.outputs.edit_id }}"

      - name: Submit Dalilna Closed Testing release for Google review
        if: env.PLAY_MODE == 'SUBMIT_FOR_REVIEW'
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PACKAGE_NAME" == "ye.dalilna.app" ]]
          [[ "$PLAY_TRACK_NAME" == "Dalilna Closed Testing" ]]
          python scripts/google_play_closed_testing_draft.py \
            --submit-for-review \
            --aab dist/aab/app-release.aab \
            --assets-dir dist/play-assets \
            --testers-google-group "$TESTERS_GOOGLE_GROUP"

      - name: Summarize the action
        if: success()
        shell: bash
        run: |
          {
            echo "## Dalilna Play Console action"
            echo
            if [[ "$PLAY_MODE" == "INSPECT_ONLY" ]]; then
              echo "- Mode: read-only inspection"
              echo "- App changes committed: **No**"
              echo "- Changes submitted for review: **No**"
            elif [[ "$PLAY_MODE" == "STAGE_ONLY" ]]; then
              echo "- Mode: stage the bundle and Closed Testing release in an isolated uncommitted edit"
              echo "- Package: `ye.dalilna.app`"
              echo "- Closed Testing versionCode: `4128701`"
              echo "- App changes committed: **No**"
              echo "- Changes submitted for review: **No**"
              echo "- Store listing metadata changed: **No**"
              echo "- Store artwork changed: **No**"
              echo "- Tester configuration changed: **No**"
              echo "- Production track touched: **No**"
            elif [[ "$PLAY_MODE" == "SUBMIT_FOR_REVIEW" ]]; then
              echo "- Mode: submit the initial Closed Testing draft and store listing for review"
              echo "- Package: `ye.dalilna.app`"
              echo "- Closed Testing versionCode: `4128701`"
              echo "- Closed Testing release status: **draft**"
              echo "- Google Play commit sends this edit for review."
              echo "- Production track touched: **No**"
            else
              echo "- Mode: promote the reviewed Closed Testing draft to available testers"
              echo "- Package: `ye.dalilna.app`"
              echo "- Closed Testing versionCode: `4128701`"
              echo "- Production track touched: **No**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
