name: One-time smart publish for Dalilna 3.1.0 Closed Testing

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-current-4129001.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: dalilna-play-closed-testing-publication
  cancel-in-progress: false

jobs:
  publish-current-draft:
    if: ${{ github.repository == 'baraagpt6-droid/dalilna' && github.ref == 'refs/heads/main' }}
    name: Promote only the verified 4129001 Closed Testing draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Dalilna main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Google authentication
        run: python -m pip install "google-auth>=2.40,<3" "requests>=2.32,<3"

      - name: Test smart publication guards
        run: python -m unittest scripts.test_smart_publish_closed_testing -v

      - name: Authenticate to Google Cloud using Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: "projects/28058491662/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "dalilna-play-automation@dalilna-play-automation-516000.iam.gserviceaccount.com"
          create_credentials_file: true
          export_environment_variables: true

      - name: Publish 4129001 or retain it safely as draft if a review is active
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
        run: >-
          python scripts/smart_publish_closed_testing.py
          --version-code 4129001
          --sha256 3e321203e6457ec44724b88d400c6ba4ffd21ec4884da46f0ff7d4b82d25e740
