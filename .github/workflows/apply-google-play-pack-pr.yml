name: One-time Play contact sync
on:
  pull_request:
    types: [opened]
    branches: [main]
permissions:
  contents: write
jobs:
  sync:
    if: github.event.action == 'opened'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - run: node -e "require('fs').unlinkSync('.github/workflows/apply-google-play-pack-pr.yml')"
      - run: node scripts/apply-google-play-pack.cjs
