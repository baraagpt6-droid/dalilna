name: Refresh Yemen market reference prices

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 5"

permissions:
  contents: write
  actions: write

concurrency:
  group: dalilna-market-reference-prices
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Refresh allowlisted public price sources
        run: node scripts/refresh-market-prices.cjs
      - name: Sync PWA sources and refreshed prices into Android offline assets
        run: |
          cp market_prices_yemen.json android/app/src/main/assets/market_prices_yemen.json
          cp sw.js marketplace-client.js version.json android/app/src/main/assets/
      - name: Validate data and commit the weekly price snapshot
        run: |
          node --test tests/market-price-guide.test.cjs
          if git diff --quiet -- market_prices_yemen.json android/app/src/main/assets/market_prices_yemen.json android/app/src/main/assets/sw.js android/app/src/main/assets/marketplace-client.js android/app/src/main/assets/version.json; then
            echo "No validated price or Android mirror changes were available."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market_prices_yemen.json android/app/src/main/assets/market_prices_yemen.json android/app/src/main/assets/sw.js android/app/src/main/assets/marketplace-client.js android/app/src/main/assets/version.json
          git commit -m "data(prices): refresh Yemen market reference prices"
          git push origin HEAD:main
          gh api --method POST "/repos/$GITHUB_REPOSITORY/actions/workflows/deploy-pages.yml/dispatches" -f ref=main
