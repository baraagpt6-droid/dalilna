name: Dalilna v2.8.0 live E2E audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/e2e-audit.yml"
      - "server.js"
      - "api/assistant.js"
      - "index.html"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  live-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build and inspect the national light index
        run: |
          python3 scripts/build_search_index_light.py --catalog-dir regional-catalog --output regional-catalog/search_index_light.json
          python3 - <<'PY'
          import base64, gzip, json, re
          from pathlib import Path
          envelope=json.loads(Path("regional-catalog/search_index_light.json").read_text(encoding="utf-8"))
          payload=json.loads(gzip.decompress(base64.b64decode(envelope["data"])))
          def norm(s):
              s=str(s or "")
              s=re.sub(r"[ًٌٍَُِّْـ]", "", s)
              return s.translate(str.maketrans({"أ":"ا","إ":"ا","آ":"ا","ى":"ي","ة":"ه"})).lower()
          rows=payload["i"]
          names=[(str(row[1]), payload["c"][row[2]], payload["g"][row[3]], payload["d"][row[4]][0]) for row in rows]
          report={}
          for term in ["الزوقري","الناهي"]:
              needle=norm(term)
              found=[{"name":n,"category":c,"governorate":g,"district":d} for n,c,g,d in names if needle in norm(n)]
              report[term]={"matches":len(found),"examples":found[:8]}
          pharmacies=[{"name":n,"category":c,"governorate":g,"district":d} for n,c,g,d in names if c=="pharmacy" and ("صيدل" in norm(n) or "دواء" in norm(n))]
          report["صيدلية"]={"pharmacyCategoryRecords":sum(1 for _,c,_,_ in names if c=="pharmacy"),"namedMatches":len(pharmacies),"examples":pharmacies[:8]}
          print(json.dumps({"bytes":Path("regional-catalog/search_index_light.json").stat().st_size,"recordCount":len(rows),"governorates":len(payload["g"]),"queries":report},ensure_ascii=False))
          PY
      - name: Run actual live API, marketplace and assistant probes
        env:
          LIVE_API_BASE_URL: https://dalilna-live.onrender.com
        run: |
          node --input-type=module <<'NODE' > audit-live.json
          const base=process.env.LIVE_API_BASE_URL;
          async function probe(path, options={}, timeout=7000) {
            const started=performance.now();
            const controller=new AbortController();
            const timer=setTimeout(()=>controller.abort(),timeout);
            try {
              const response=await fetch(base+path,{...options,signal:controller.signal,headers:{Accept:"application/json",...(options.headers||{})}});
              const raw=await response.text();
              let body={};try{body=JSON.parse(raw)}catch{}
              return {ok:response.ok,status:response.status,ms:Math.round(performance.now()-started),body};
            } catch(error) {
              return {ok:false,status:0,ms:Math.round(performance.now()-started),error:String(error?.message||error)};
            } finally {clearTimeout(timer);}
          }
          const health=await probe("/health");
          const marketStatus=await probe("/api/marketplace/status");
          const listings=await probe("/api/marketplace/listings?category=souq&limit=24&includeImages=1");
          const pharmacies=await probe("/api/places/search?q=%D8%B5%D9%8A%D8%AF%D9%84%D9%8A%D8%A9&category=pharmacy&place=%D9%85%D8%AD%D8%A7%D9%81%D8%B8%D8%A9%20%D8%A5%D8%A8",{},3500);
          const assistantStatus=await probe("/api/assistant/status");
          let assistant={skipped:true,reason:"Gemini key not configured"};
          if(assistantStatus.body?.configured===true) {
            const context={liveSearch:{intent:"pharmacy",selectedRegion:{governorate:"إب",district:"",place:"محافظة إب، اليمن"},openDataPlaces:(pharmacies.body?.items||[]).slice(0,8).map(x=>({name:x.name,category:x.category,governorate:x.governorate||"إب",district:x.district||"",address:x.address||"",phone:x.phone||"",source:x.source||"OpenStreetMap",verificationStatus:"not_field_verified_by_dalilna"}))}};
            const call=await probe("/api/assistant",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({question:"أقرب صيدلية في إب",context})},28000);
            assistant={ok:call.ok,status:call.status,ms:call.ms,answerChars:String(call.body?.answer||"").length,mode:call.body?.mode||"",error:call.body?.error||""};
          }
          const items=Array.isArray(listings.body?.items)?listings.body.items:[];
          const report={
            generatedAt:new Date().toISOString(),
            health:{ok:health.ok,version:health.body?.version,ms:health.ms,status:health.status},
            marketplace:{databaseReady:marketStatus.body?.ready===true,databaseConfigured:marketStatus.body?.databaseConfigured===true,
              approvedOffers:Number(listings.body?.count||0),returned:items.length,
              withImages:items.filter(x=>typeof x.imageData==="string"&&x.imageData.startsWith("data:image/")).length,
              withPrice:items.filter(x=>String(x.price||"").trim()).length,
              withContact:items.filter(x=>String(x.phone||"").trim()).length,
              ms:listings.ms,status:listings.status,error:listings.body?.error||listings.error||""},
            pharmacyLiveSearch:{ok:pharmacies.ok,status:pharmacies.status,ms:pharmacies.ms,
              within3Seconds:pharmacies.ok&&pharmacies.ms<=3000,
              results:Array.isArray(pharmacies.body?.items)?pharmacies.body.items.length:0,
              resultsWithHours:(pharmacies.body?.items||[]).filter(x=>x.openingHours||x.opening_hours).length,
              twentyFourHourResults:(pharmacies.body?.items||[]).filter(x=>/24\s?[/]?\s?7|24\s?hours|24\s?ساعة|٢٤\s?ساعة/i.test(String(x.openingHours||x.opening_hours||""))).length,
              error:pharmacies.body?.error||pharmacies.error||""},
            assistant:{configured:assistantStatus.body?.configured===true,provider:assistantStatus.body?.provider||"",model:assistantStatus.body?.model||"",...assistant}
          };
          console.log(JSON.stringify(report,null,2));
          NODE
      - name: Publish a compact audit report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          index=Path("regional-catalog/search_index_light.json")
          envelope=json.loads(index.read_text(encoding="utf-8"))
          import base64,gzip
          payload=json.loads(gzip.decompress(base64.b64decode(envelope["data"])))
          # The query results are reproduced from the exact built index.
          import re
          def norm(s):
              s=re.sub(r"[ًٌٍَُِّْـ]","",str(s or ""))
              return s.translate(str.maketrans({"أ":"ا","إ":"ا","آ":"ا","ى":"ي","ة":"ه"})).lower()
          names=[(str(r[1]),payload["c"][r[2]],payload["g"][r[3]],payload["d"][r[4]][0]) for r in payload["i"]]
          queries={}
          for term in ["الزوقري","الناهي"]:
              hits=[{"name":n,"category":c,"governorate":g,"district":d} for n,c,g,d in names if norm(term) in norm(n)]
              queries[term]={"matches":len(hits),"examples":hits[:8]}
          pharm=[{"name":n,"governorate":g,"district":d} for n,c,g,d in names if c=="pharmacy" and ("صيدل" in norm(n) or "دواء" in norm(n))]
          queries["صيدلية"]={"pharmacyRecords":sum(c=="pharmacy" for _,c,_,_ in names),"namedMatches":len(pharm),"examples":pharm[:8]}
          report={"version":"2.8.0","catalog":{"records":len(names),"governorates":len(payload["g"]),"compressedBytes":index.stat().st_size,"queries":queries},
                  "live":json.loads(Path("audit-live.json").read_text(encoding="utf-8"))}
          Path("audit").mkdir(exist_ok=True)
          Path("audit/last-e2e-v2.8.0.json").write_text(json.dumps(report,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/last-e2e-v2.8.0.json
          git commit -m "audit: publish Dalilna v2.8.0 live verification"
          pushed=false
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then pushed=true; break; fi
            echo "Audit report push race on attempt $attempt."
          done
          test "$pushed" = "true"
