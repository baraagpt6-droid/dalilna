name: Dalilna v3.1.0 live E2E audit
# Final signed APK metadata is published before this live audit runs.
# Re-run live probes after the signed APK and assistant fallback are deployed.

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/e2e-audit.yml"
      - "server.js"
      - "api/assistant.js"
      - "index.html"
      - "v3.0.0.js"
      - "v3.0.0.css"
      - "version.json"
      - "regional-catalog/**"
      - "tests/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/e2e-audit.yml"
      - "server.js"
      - "api/assistant.js"
      - "index.html"
      - "v3.0.0.js"
      - "v3.0.0.css"
      - "version.json"
      - "regional-catalog/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  live-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build and inspect the national light index
        run: |
          python3 scripts/build_search_index_light.py --catalog-dir regional-catalog --output regional-catalog/search_index_light.json
          python3 - <<'PY'
          import base64, gzip, json, re
          from pathlib import Path
          from time import perf_counter
          envelope=json.loads(Path("regional-catalog/search_index_light.json").read_text(encoding="utf-8"))
          payload=json.loads(gzip.decompress(base64.b64decode(envelope["data"])))
          def norm(s):
              s=str(s or "")
              s=re.sub(r"[ًٌٍَُِّْـ]", "", s)
              return s.translate(str.maketrans({"أ":"ا","إ":"ا","آ":"ا","ى":"ي","ة":"ه"})).lower()
          rows=payload["i"]
          names=[(str(row[1]), payload["c"][row[2]], payload["g"][row[3]], payload["d"][row[4]][0], str(row[8] or "")) for row in rows]
          # The app precomputes normalized search keys when loading the index.
          prepared=[(norm(n),n,cat,gov,district,hours) for n,cat,gov,district,hours in names]
          def is24(value):
              text=norm(value).lower()
              return bool(re.search(r"24\s*/\s*7|24\s*(?:ساعة|hours?|h\b)|00:00\s*-\s*24:00|على مدار الساعة|دوام مستمر",text))
          report={}
          for term in ["الزوقري","الناهي","صيدلية"]:
              started=perf_counter()
              needle=norm(term)
              found=[{"name":n,"category":cat,"governorate":g,"district":d} for normalized,n,cat,g,d,hours in prepared if needle in normalized]
              elapsed=(perf_counter()-started)*1000
              report[term]={"matches":len(found),"searchMs":round(elapsed,3),"within50ms":elapsed<50,"examples":found[:8]}
          pharmacies=[{"name":n,"governorate":g,"district":d} for n,cat,g,d,hours in names if cat=="pharmacy" and ("صيدل" in norm(n) or "دواء" in norm(n))]
          pharmacy_records=[(n,g,d,hours) for n,cat,g,d,hours in names if cat=="pharmacy"]
          report["صيدلية"]["pharmacyCategoryRecords"]=len(pharmacy_records)
          report["صيدلية"]["namedPharmacyMatches"]=len(pharmacies)
          report["صيدلية"]["open24HoursRecords"]=sum(1 for _,_,_,hours in pharmacy_records if is24(hours))
          report["صيدلية"]["examples"]=pharmacies[:8]
          catalog_report={"bytes":Path("regional-catalog/search_index_light.json").stat().st_size,"recordCount":len(rows),"governorates":len(payload["g"]),"schemaVersion":envelope["schemaVersion"],"queries":report}
          Path("audit-catalog.json").write_text(json.dumps(catalog_report,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(catalog_report,ensure_ascii=False))
          PY
      - name: Run actual live API, marketplace and assistant probes
        env:
          LIVE_API_BASE_URL: https://dalilna-live.onrender.com
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE' > audit-live.json
          const base=process.env.LIVE_API_BASE_URL;
          async function probe(path, options={}, timeout=7000) {
            const started=performance.now();
            const controller=new AbortController();
            const timer=setTimeout(()=>controller.abort(),timeout);
            try {
              const response=await fetch(base+path,{...options,signal:controller.signal,headers:{Accept:"application/json",...(options.headers||{})}});
              const raw=await response.text();
              let body={};try{body=JSON.parse(raw)}catch{}
              return {ok:response.ok,status:response.status,ms:Math.round(performance.now()-started),body,corsOrigin:response.headers.get("access-control-allow-origin")};
            } catch(error) {
              return {ok:false,status:0,ms:Math.round(performance.now()-started),error:String(error?.message||error)};
            } finally {clearTimeout(timer);}
          }
          let health=await probe("/health");
          for(let attempt=0;attempt<48&&!["3.1.0"].includes(health.body?.version);attempt++){
            await new Promise(resolve=>setTimeout(resolve,5000));
            health=await probe("/health");
          }
          const marketStatus=await probe("/api/marketplace/status");
          const listings=await probe("/api/marketplace/listings?category=souq&limit=24&includeImages=1");
          const pharmacies=await probe("/api/places/search?q=%D8%B5%D9%8A%D8%AF%D9%84%D9%8A%D8%A9&category=pharmacy&place=%D9%85%D8%AD%D8%A7%D9%81%D8%B8%D8%A9%20%D8%A5%D8%A8",{},6500);
          const assistantStatus=await probe("/api/assistant/status",{headers:{Origin:"https://baraagpt6-droid.github.io"}});
          const publicBase="https://baraagpt6-droid.github.io/dalilna/";
          let publicSite={ok:false,error:"GitHub Pages PWA not retrieved"};
          let publicIndexPayload=null;
          try {
            async function getPublic(path) {
              let lastError;
              for(let attempt=0;attempt<90;attempt++) {
                try {
                  const response=await fetch(new URL(path,publicBase),{cache:"no-store"});
                  if(response.ok){
                    if(path.startsWith("version.json")){
                      const current=await response.clone().json();
                      if(current.webVersion==="3.1.0"&&current.officialWebUrl===publicBase)return response;
                      lastError=new Error("GitHub Pages version.json is not yet aligned with v3.1.0 and the official URL.");
                    }else return response;
                  }else lastError=new Error(path+" HTTP "+response.status);
                } catch(error) {lastError=error;}
                await new Promise(resolve=>setTimeout(resolve,2000));
              }
              throw lastError||new Error("GitHub Pages did not publish the current website version.");
            }
            const versionRes=await getPublic("version.json?audit="+process.env.GITHUB_SHA);
            const version=await versionRes.json();
            const [pageRes,marketRes,indexRes,clientRes,v3jsRes,v3cssRes,featuresRes,jobsRes]=await Promise.all([
              getPublic("index.html"),getPublic("market_items.json"),
              getPublic("regional-catalog/search_index_light.json?v=3.1.0-pharmacy24"),getPublic("marketplace-client.js"),
              getPublic("v3.0.0.js?v=3.1.0"),getPublic("v3.0.0.css?v=3.1.0"),getPublic("features-2.1.js?v=3.1.0"),getPublic("jobs-feed.json")
            ]);
            const pageText=await pageRes.text(),market=await marketRes.json(),clientText=await clientRes.text();
            const v3js=await v3jsRes.text(),v3css=await v3cssRes.text(),featuresText=await featuresRes.text(),jobsFeed=await jobsRes.json();
            const {gunzipSync}=await import("node:zlib");
            const publicBytes=await indexRes.arrayBuffer();
            const publicEnvelope=JSON.parse(new TextDecoder().decode(publicBytes));
            publicIndexPayload=JSON.parse(gunzipSync(Buffer.from(publicEnvelope.data,"base64")).toString("utf8"));
            publicSite={ok:true,version:version.webVersion||version.version,signingMode:version.androidSigningMode,androidVersionCode:version.androidVersionCode,
              v3SavedHub:v3js.includes("savedHubDialog")&&v3js.includes("dalilna:favorite-change"),
              v3FlyAnimation:v3js.includes("cubic-bezier"),v3JobSearch:featuresText.includes("jobsInlineSearch")&&featuresText.includes("jobsSavedFilter"),
              v3JobFeedCount:Array.isArray(jobsFeed.items)?jobsFeed.items.length:0,
              assistantJobsLocal:Array.isArray(jobsFeed.items)&&jobsFeed.items.length>0&&pageText.includes('fetch("./jobs-feed.json"')&&pageText.includes("assistantCards:cards"),
              assistantLocalFallback:pageText.includes("const localFallback={answer:answerAI(q)")&&pageText.includes("المجيب: دليلنا المحلي"),
              jobFeedWithSourceLinks:Array.isArray(jobsFeed.items)?jobsFeed.items.filter(item=>item.applicationUrl||item.url||item.sourceUrl).length:0,
              v3Styles:v3css.includes(".v3-favorite-trigger"),bytes:publicBytes.byteLength,
              schemaVersion:publicEnvelope.schemaVersion,records:publicIndexPayload.i?.length||0,
              pharmacyRecords:publicIndexPayload.i?.filter(row=>publicIndexPayload.c[row[2]]==="pharmacy").length||0,
              open24Pharmacies:publicIndexPayload.i?.filter(row=>publicIndexPayload.c[row[2]]==="pharmacy"&&/(24\s*\/\s*7|24\s*(?:hours?|h\b)|00:00\s*-\s*24:00|على مدار الساعة)/i.test(String(row[8]||""))).length||0,
              marketplaceReferenceItems:Array.isArray(market.items)?market.items.length:null,
              pharmacy24Shortcut:pageText.includes('id="pharmacy24QuickBtn"'),
              craftCategory:pageText.includes("craft:")||pageText.includes('"craft"'),
              directoryWhatsApp:pageText.includes("مشاركة واتساب"),
              productWhatsApp:clientText.includes("مشاركة واتساب")};
            let release=null,apk=null,lastReleaseError=null;
            for(let attempt=0;attempt<90;attempt++){
              try{
                const releaseResponse=await fetch("https://api.github.com/repos/baraagpt6-droid/dalilna/releases/tags/v3.1.0",{headers:{Accept:"application/vnd.github+json",Authorization:"Bearer "+process.env.GH_TOKEN}});
                if(releaseResponse.ok){
                  release=await releaseResponse.json();
                  apk=release.assets?.find(asset=>asset.name==="app-release.apk");
                  if(apk&&apk.browser_download_url===version.androidReleaseUrl&&String(release.body||"").includes("Signing mode: persistent"))break;
                  lastReleaseError=new Error("GitHub v3.1.0 release asset is not ready.");
                }else lastReleaseError=new Error("GitHub v3.1.0 release HTTP "+releaseResponse.status);
              }catch(error){lastReleaseError=error;}
              await new Promise(resolve=>setTimeout(resolve,2000));
            }
            if(!apk||apk.browser_download_url!==version.androidReleaseUrl||!String(release?.body||"").includes("Signing mode: persistent"))throw lastReleaseError||new Error("The persistent v3.1.0 Android APK release asset is missing.");
            if(publicSite.version!=="3.1.0"||publicSite.signingMode!=="persistent"||version.officialWebUrl!==publicBase||!pageText.includes('<link rel="canonical" href="'+publicBase+'">'))throw new Error("Published GitHub Pages version, canonical URL or Android signing mode is not aligned to v3.1.0.");
            if(assistantStatus.corsOrigin!=="https://baraagpt6-droid.github.io")throw new Error("Render assistant CORS does not allow the official GitHub Pages origin.");
            publicSite.androidRelease={ok:true,versionCode:version.androidVersionCode,size:apk.size,digest:apk.digest,downloadUrl:apk.browser_download_url};
            publicSite.netlifyLegacyAlias={ok:true,skipped:true,reason:"Legacy Netlify is not an official Dalilna deployment target; GitHub Pages and Render are authoritative."};

            if(!publicSite.v3SavedHub||!publicSite.v3FlyAnimation||!publicSite.v3JobSearch||!publicSite.v3Styles||!publicSite.assistantJobsLocal||!publicSite.assistantLocalFallback||publicSite.jobFeedWithSourceLinks===0)throw new Error("A v3 saved hub, animation, job filter, local jobs assistant or source-link asset is missing.");
            if(!health.ok||!["3.0.1","3.1.0"].includes(health.body?.version))throw new Error("Render health did not return a compatible Dalilna API version after waiting.");
          } catch(error) {publicSite={ok:false,error:String(error?.message||error)};}
          if(!publicSite.ok)throw new Error("Published v3.1.0 Pages audit failed: "+(publicSite.error||"unknown error"));
          if(!health.ok||!["3.0.1","3.1.0"].includes(health.body?.version))throw new Error("Render health did not return a compatible Dalilna API version after waiting.");
          let assistant={skipped:true,reason:"Gemini key not configured"};
          if(assistantStatus.body?.configured===true) {
            const rows=publicIndexPayload?.i||[];
            const openDataPlaces=rows.filter(row=>publicIndexPayload.c[row[2]]==="pharmacy"&&publicIndexPayload.g[row[3]]==="إب").slice(0,8).map(row=>({
              name:row[1],category:"صيدليات",governorate:"إب",district:publicIndexPayload.d[row[4]]?.[0]||"",phone:row[5]||"",
              lat:row[6]===null?null:row[6]/100000,lon:row[7]===null?null:row[7]/100000,
              openingHours:row[8]||"",source:"فهرس اليمن الوطني",verificationStatus:"not_field_verified_by_dalilna"}));
            const context={liveSearch:{intent:"pharmacy",selectedRegion:{governorate:"إب",district:"",place:"محافظة إب، اليمن"},openDataPlaces}};
            const call=await probe("/api/assistant",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({question:"أقرب صيدلية في إب",context})},18000);
            assistant={ok:call.ok,status:call.status,ms:call.ms,answerChars:String(call.body?.answer||"").length,mode:call.body?.mode||"",error:call.body?.error||"",providerStatus:call.body?.providerStatus||0,providerCode:call.body?.providerCode||""};
          }
          const items=Array.isArray(listings.body?.items)?listings.body.items:[];
          const report={
            generatedAt:new Date().toISOString(),
            health:{ok:health.ok,version:health.body?.version,ms:health.ms,status:health.status},
            marketplace:{databaseReady:marketStatus.body?.ready===true,databaseConfigured:marketStatus.body?.databaseConfigured===true,
              approvedOffers:Number(listings.body?.count||0),returned:items.length,
              withImages:items.filter(x=>typeof x.imageData==="string"&&x.imageData.startsWith("data:image/")).length,
              withPrice:items.filter(x=>String(x.price||"").trim()).length,
              withContact:items.filter(x=>String(x.phone||"").trim()).length,
              ms:listings.ms,status:listings.status,error:listings.body?.error||listings.error||""},
            pharmacyLiveSearch:{ok:pharmacies.ok,status:pharmacies.status,ms:pharmacies.ms,
              respondedWithin3Seconds:pharmacies.ms<=3000,successfulWithin3Seconds:pharmacies.ok&&pharmacies.ms<=3000,
              results:Array.isArray(pharmacies.body?.items)?pharmacies.body.items.length:0,
              localCatalogFallback:pharmacies.body?.localCatalogFallback===true,
              resultSource:pharmacies.body?.source||"",
              resultsWithHours:(pharmacies.body?.items||[]).filter(x=>x.openingHours||x.opening_hours).length,
              twentyFourHourResults:(pharmacies.body?.items||[]).filter(x=>/24\s?[/]?\s?7|24\s?hours|24\s?ساعة|٢٤\s?ساعة/i.test(String(x.openingHours||x.opening_hours||""))).length,
              error:pharmacies.body?.error||pharmacies.error||""},
            assistant:{configured:assistantStatus.body?.configured===true,provider:assistantStatus.body?.provider||"",model:assistantStatus.body?.model||"",...assistant},
            publicSite
          };
          if(!pharmacies.ok||!Array.isArray(pharmacies.body?.items)||pharmacies.body.items.length===0)throw new Error("Pharmacy API returned no live or local Yemen catalogue results.");
          console.log(JSON.stringify(report,null,2));
          NODE
      - name: Print live E2E audit results
        run: |
          echo "=== Catalog benchmark ==="
          cat audit-catalog.json
          echo "=== Live deployed probes ==="
          cat audit-live.json
      - name: Publish a compact audit report
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          catalog=json.loads(Path("audit-catalog.json").read_text(encoding="utf-8"))
          report={"version":"3.1.0","catalog":catalog,"live":json.loads(Path("audit-live.json").read_text(encoding="utf-8"))}
          Path("audit").mkdir(exist_ok=True)
          Path("audit/last-e2e-v3.1.0.json").write_text(json.dumps(report,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/last-e2e-v3.1.0.json
          git commit -m "audit: publish Dalilna v3.1.0 live verification"
          # The audit regenerates the tracked compressed index. Keep the report
          # commit, but discard generated working-tree changes before rebasing.
          git restore --worktree --staged .
          git clean -fd
          pushed=false
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              # Concurrent audit runs may update the same report. Keep this
              # run's completed report while retaining every other main change.
              if [ "$(git diff --name-only --diff-filter=U)" = "audit/last-e2e-v3.1.0.json" ]; then
                git checkout --theirs audit/last-e2e-v3.1.0.json
                git add audit/last-e2e-v3.1.0.json
                GIT_EDITOR=true git rebase --continue
              else
                git rebase --abort
                echo "Unexpected rebase conflict on attempt $attempt."
                continue
              fi
            fi
            if git push origin HEAD:main; then pushed=true; break; fi
            echo "Audit report push race on attempt $attempt."
          done
          test "$pushed" = "true"
