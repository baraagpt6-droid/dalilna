name: Refresh merchant marketplace products

on:
  schedule:
    - cron: "45 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/refresh-marketplace-products.cjs"
      - "marketplace-api.js"
      - ".github/workflows/refresh-marketplace-products.yml"

permissions:
  contents: read

concurrency:
  group: dalilna-marketplace-product-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate and import verified merchant feeds
        env:
          DALILNA_API_BASE_URL: https://dalilna-live.onrender.com
          DALILNA_PRODUCT_FEED_URLS: ${{ vars.DALILNA_PRODUCT_FEED_URLS }}
          DALILNA_PRODUCT_SYNC_TOKEN: ${{ secrets.DALILNA_PRODUCT_SYNC_TOKEN }}
        run: node scripts/refresh-marketplace-products.cjs
