name: Clean temporary Play helpers
on:
  push:
    branches: [chore/google-play-submission-pack]
    paths: [.github/workflows/clean-play-helpers.yml]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: ${{ github.ref_name }} }
      - run: node scripts/fix-play-policy-wording.cjs && rm -f .github/workflows/apply-google-play-pack-pr.yml .github/workflows/fix-policy-copy.yml .github/workflows/clean-play-helpers.yml scripts/fix-play-policy-wording.cjs test-arabic.md play-release-handoff.txt && git config user.name github-actions\[bot\] && git config user.email 41898282+github-actions\[bot\]@users.noreply.github.com && git add -A && git commit -m 'fix(play): tidy privacy contact and remove temporary helpers' && git push origin HEAD
