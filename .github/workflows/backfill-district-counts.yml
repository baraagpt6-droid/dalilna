name: Backfill Yemen district counts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/backfill_district_counts.py"
      - ".github/workflows/backfill-district-counts.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: dalilna-regional-catalog
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fetch administrative district reference data
        run: |
          git clone --depth 1 --branch master https://github.com/open-admin-data/yemen-administrative-divisions.git admin-data
          test -s admin-data/data/all-district.json
          python3 - <<'PY'
          import json
          with open("admin-data/data/all-district.json", encoding="utf-8") as stream:
              rows = json.load(stream)
          assert len(rows) == 335, f"Expected 335 districts, got {len(rows)}"
          print("Loaded administrative districts:", len(rows))
          PY
      - name: Backfill and validate district counts
        run: python3 scripts/backfill_district_counts.py --districts admin-data/data/all-district.json
      - name: Commit updated catalogue data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- regional-catalog; then
            echo "District catalogue data is already up to date."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add regional-catalog
            git commit -m "data: backfill Yemen district assignments and counts"
            git push origin HEAD:main
          fi
          # A push made with GITHUB_TOKEN does not start other push workflows.
          # Dispatch the website, Android build and post-deploy verification explicitly.
          gh workflow run deploy-pages.yml --ref main
          gh workflow run android-apk.yml --ref main
          gh workflow run places-proxy-verification.yml --ref main
