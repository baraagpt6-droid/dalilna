name: Verify public directory and shared marketplace

on:
  pull_request:
    branches: [main]
    paths:
      - 'server.js'
      - 'jobs-api.js'
      - 'features-2.1.js'
      - 'features-2.1.css'
      - 'jobs-feed.json'
      - 'version.json'
      - 'marketplace-api.js'
      - 'marketplace-client.js'
      - 'db/**'
      - 'index.html'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/places-proxy-verification.yml'
  push:
    branches: [main]
    paths:
      - 'server.js'
      - 'jobs-api.js'
      - 'features-2.1.js'
      - 'features-2.1.css'
      - 'jobs-feed.json'
      - 'marketplace-api.js'
      - 'marketplace-client.js'
      - 'db/**'
      - 'index.html'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/places-proxy-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Sync PWA and regional catalogue into Android WebView assets
        shell: bash
        run: |
          mkdir -p android/app/src/main/assets/icons android/app/src/main/assets/regional-catalog
          cp index.html regional-catalog-runtime.js marketplace-client.js features-2.1.js features-2.1.css jobs-feed.json manifest.json version.json sw.js regions-yemen.js regions-profiles.js privacy.html terms.html android/app/src/main/assets/
          cp icons/* android/app/src/main/assets/icons/
          cp regional-catalog/*.json android/app/src/main/assets/regional-catalog/
          cmp -s index.html android/app/src/main/assets/index.html
          cmp -s regional-catalog-runtime.js android/app/src/main/assets/regional-catalog-runtime.js
          cmp -s sw.js android/app/src/main/assets/sw.js
          cmp -s marketplace-client.js android/app/src/main/assets/marketplace-client.js
          cmp -s features-2.1.js android/app/src/main/assets/features-2.1.js
          cmp -s features-2.1.css android/app/src/main/assets/features-2.1.css
          cmp -s jobs-feed.json android/app/src/main/assets/jobs-feed.json
          cmp -s version.json android/app/src/main/assets/version.json
      - name: Verify Python data-fusion pipeline and deduplication
        run: |
          python3 -m py_compile scripts/build_regional_catalog.py scripts/fuse_regional_catalog.py scripts/test_regional_catalog.py
          python3 scripts/test_regional_catalog.py
      - name: Run unit and UI tests
        run: npm test
      - name: Verify real HTTP routes with mocked OSM and Commons providers
        run: node scripts/places-proxy-integration.cjs
      - name: Verify deployed Render open-data search and Commons photos
        if: github.event_name == 'push'
        env:
          LIVE_API_BASE_URL: https://dalilna-live.onrender.com
        run: node scripts/live-places-smoke.cjs
      - name: Verify Dalilna 2.6 live API, marketplace database and jobs endpoints
        if: github.event_name == 'push'
        env:
          LIVE_API_BASE_URL: https://dalilna-live.onrender.com
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.LIVE_API_BASE_URL;
          async function get(path) {
            const response = await fetch(base + path, { headers: { Accept: "application/json" } });
            const body = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(path + " returned HTTP " + response.status + ": " + JSON.stringify(body));
            return body;
          }
          const health = await get("/health");
          if (health.version !== "2.6.0") throw new Error("Expected API version 2.6.0, got " + health.version);
          const market = await get("/api/marketplace/status");
          if (market.ready !== true || market.databaseConfigured !== true) {
            throw new Error("Marketplace database is not ready: " + JSON.stringify(market));
          }
          const jobs = await get("/api/jobs?country=YE&limit=10");
          if (!Array.isArray(jobs.items)) throw new Error("Jobs endpoint did not return an items array.");
          if (jobs.count < 1 || !jobs.fetchedAt || jobs.items.length < 1) throw new Error("The deployed Render jobs index is empty or stale: " + JSON.stringify({count: jobs.count, fetchedAt: jobs.fetchedAt}));
          if (jobs.items.some(item => item.country !== "Yemen")) throw new Error("The Yemen jobs filter returned another country.");
          const seekers = await get("/api/jobs/candidates?country=Yemen&limit=10");
          if (!Array.isArray(seekers.items)) throw new Error("Job-seeker endpoint did not return an items array.");
          const assistant = await get("/api/assistant/status");
          if (assistant.provider !== "Gemini" || typeof assistant.configured !== "boolean") {
            throw new Error("Render Gemini assistant status endpoint returned an invalid response.");
          }
          // Probe Vercel with an empty question. The current Vercel deployment may
          // still have the older POST-only handler while its deployment is rate-limited.
          // The handler checks for a missing key before validating the question, so
          // this distinguishes configured vs missing without calling Gemini or spending tokens.
          const vercelProbe = await fetch("https://dalilna-oavk.vercel.app/api/assistant", {
            method: "POST",
            headers: { "Content-Type": "application/json", Accept: "application/json" },
            body: JSON.stringify({ question: "" })
          });
          const vercelProbeBody = await vercelProbe.json().catch(() => ({}));
          let geminiVercelKeyConfigured;
          if (vercelProbe.status === 503 && vercelProbeBody.error === "cloud_ai_not_configured") {
            geminiVercelKeyConfigured = false;
          } else if (vercelProbe.status === 400 && vercelProbeBody.error === "question_required") {
            geminiVercelKeyConfigured = true;
          } else {
            throw new Error("Vercel Gemini configuration probe returned an unexpected response: HTTP " + vercelProbe.status);
          }
          console.log(JSON.stringify({
            apiVersion: health.version,
            marketplaceDatabaseReady: market.ready,
            jobsReturned: jobs.items.length,
            jobSeekersReturned: seekers.items.length,
            geminiProvider: assistant.provider,
            geminiRenderKeyConfigured: assistant.configured,
            geminiVercelKeyConfigured,
            geminiModel: assistant.model,
            jobsFeedUpdatedAt: jobs.fetchedAt
          }, null, 2));
          NODE
