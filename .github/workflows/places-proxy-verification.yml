name: Verify public directory and shared marketplace

on:
  pull_request:
    branches: [main]
    paths:
      - 'server.js'
      - 'marketplace-api.js'
      - 'marketplace-client.js'
      - 'db/**'
      - 'index.html'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/places-proxy-verification.yml'
  push:
    branches: [main]
    paths:
      - 'server.js'
      - 'marketplace-api.js'
      - 'marketplace-client.js'
      - 'db/**'
      - 'index.html'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/places-proxy-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Run unit and UI tests
        run: npm test
      - name: Verify real HTTP routes with mocked OSM and Commons providers
        run: node scripts/places-proxy-integration.cjs
      - name: Verify deployed Render open-data search and Commons photos
        if: github.event_name == 'push'
        env:
          LIVE_API_BASE_URL: https://dalilna-live.onrender.com
        run: node scripts/live-places-smoke.cjs
