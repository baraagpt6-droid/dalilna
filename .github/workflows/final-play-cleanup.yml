name: Final Dalilna Play handoff cleanup
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/final-play-cleanup.yml
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix privacy policy copy and remove temporary helpers
        run: |
          node scripts/fix-play-policy-wording.cjs
          rm -f .github/workflows/apply-google-play-pack-pr.yml .github/workflows/fix-policy-copy.yml .github/workflows/clean-play-helpers.yml .github/workflows/final-play-cleanup.yml .github/workflows/fix-play-policy-wording.yml scripts/fix-play-policy-wording.cjs test-arabic.md play-release-handoff.txt
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No cleanup changes to commit.'
            exit 0
          fi
          git commit -m 'chore(play): remove temporary handoff helpers'
          git push origin HEAD:main
