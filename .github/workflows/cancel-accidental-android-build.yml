name: Stop accidental duplicate Dalilna Android build

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cancel-accidental-android-build.yml"

permissions:
  actions: write
  contents: read

jobs:
  cancel-duplicate:
    if: ${{ github.repository == 'baraagpt6-droid/dalilna' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Cancel only the duplicate build triggered by monitor source changes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          cancelled=0
          for run_id in 46038352510; do
            run_json="$(curl --fail-with-body --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$repo/actions/runs/$run_id")"
            status="$(jq -r '.status' <<< "$run_json")"
            workflow_path="$(jq -r '.path' <<< "$run_json")"
            run_repo="$(jq -r '.repository.full_name' <<< "$run_json")"
            if [[ "$run_repo" != "baraagpt6-droid/dalilna" || "$workflow_path" != ".github/workflows/android-apk.yml" ]]; then
              echo "::error::Run $run_id does not match the exact Dalilna Android workflow scope."
              exit 1
            fi
            if [[ "$status" == "queued" || "$status" == "in_progress" || "$status" == "pending" ]]; then
              curl --fail-with-body --silent --show-error -X POST \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer $GH_TOKEN" \
                "https://api.github.com/repos/$repo/actions/runs/$run_id/cancel"
              echo "Cancelled duplicate Android build run $run_id."
              cancelled=$((cancelled + 1))
            else
              echo "Run $run_id is already $status; no cancellation needed."
            fi
          done
          {
            echo "## Dalilna Android workflow guard"
            echo
            echo "- Repository: baraagpt6-droid/dalilna"
            echo "- Play upload: none"
            echo "- Duplicate Android build cancellations: $cancelled"
          } >> "$GITHUB_STEP_SUMMARY"
