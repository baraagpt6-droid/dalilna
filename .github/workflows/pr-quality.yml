name: Dalilna 2.9.0 quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - feat/dalilna-v2.7.0-national-classifier-search-ux
    paths:
      - 'index.html'
      - 'server.js'
      - 'category-mapping.json'
      - 'scripts/**'
      - 'tests/**'
      - 'android/**'
      - 'package.json'
      - '.github/workflows/pr-quality.yml'

permissions:
  contents: read

concurrency:
  group: dalilna-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Node.js dependencies
        run: npm install --no-audit --no-fund

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build compressed full-Yemen search index
        run: python scripts/build_search_index_light.py --catalog-dir regional-catalog --output regional-catalog/search_index_light.json

      - name: Verify compressed search index
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path("regional-catalog/search_index_light.json")
          payload=json.loads(path.read_text(encoding="utf-8"))
          assert path.stat().st_size <= 1_500_000
          assert payload.get("recordCount",0)>0
          assert payload.get("encoding") == "gzip+base64"
          print("National search index:", payload["recordCount"], "records,", path.stat().st_size, "bytes")
          PY

      - name: Sync PWA and national catalogue into Android assets
        shell: bash
        run: |
          mkdir -p android/app/src/main/assets/icons android/app/src/main/assets/regional-catalog android/app/src/main/assets/market-price-images
          cp index.html app-native-bridge.js app-update.js market-price-guide.js market-price-guide.css market_prices_yemen.json regional-catalog-runtime.js marketplace-client.js features-2.1.js features-2.1.css jobs-feed.json manifest.json version.json sw.js regions-yemen.js regions-profiles.js privacy.html terms.html android/app/src/main/assets/
          cp icons/* android/app/src/main/assets/icons/
          cp market-price-images/*.svg android/app/src/main/assets/market-price-images/
          cp regional-catalog/*.json android/app/src/main/assets/regional-catalog/
          for name in index.html app-native-bridge.js app-update.js market-price-guide.js market-price-guide.css market_prices_yemen.json sw.js marketplace-client.js manifest.json version.json jobs-feed.json; do
            cmp -s "$name" "android/app/src/main/assets/$name" || { echo "$name asset is stale"; exit 1; }
          done
          cmp -s regions-yemen.js android/app/src/main/assets/regions-yemen.js
          for image in market-price-images/*.svg; do
            cmp -s "$image" "android/app/src/main/assets/$image" || { echo "$image asset is stale"; exit 1; }
          done
          cmp -s regional-catalog/search_index_light.json android/app/src/main/assets/regional-catalog/search_index_light.json

      - name: Check JavaScript syntax
        run: node --check server.js

      - name: Compile data scripts
        run: python -m py_compile scripts/build_regional_catalog.py scripts/fuse_regional_catalog.py scripts/test_regional_catalog.py scripts/build_search_index_light.py tests/test_search_index_light.py

      - name: Test compressed national search-index generator
        run: python tests/test_search_index_light.py

      - name: Run JavaScript tests
        run: npm test

      - name: Run Yemen regional catalog tests
        run: python scripts/test_regional_catalog.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Android debug APK
        run: gradle --no-daemon :android:app:assembleDebug
