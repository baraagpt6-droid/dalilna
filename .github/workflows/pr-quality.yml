name: Dalilna 2.7.0 quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - feat/dalilna-v2.7.0-national-classifier-search-ux
    paths:
      - 'index.html'
      - 'server.js'
      - 'category-mapping.json'
      - 'scripts/**'
      - 'tests/**'
      - 'android/**'
      - 'package.json'
      - '.github/workflows/pr-quality.yml'

permissions:
  contents: read

concurrency:
  group: dalilna-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Node.js dependencies
        run: npm install --no-audit --no-fund

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync PWA and national catalogue into Android assets
        shell: bash
        run: |
          mkdir -p android/app/src/main/assets/icons android/app/src/main/assets/regional-catalog
          cp index.html regional-catalog-runtime.js marketplace-client.js features-2.1.js features-2.1.css jobs-feed.json manifest.json version.json sw.js regions-yemen.js regions-profiles.js privacy.html terms.html android/app/src/main/assets/
          cp icons/* android/app/src/main/assets/icons/
          cp regional-catalog/*.json android/app/src/main/assets/regional-catalog/
          cmp -s index.html android/app/src/main/assets/index.html
          cmp -s regions-yemen.js android/app/src/main/assets/regions-yemen.js
          cmp -s version.json android/app/src/main/assets/version.json

      - name: Check JavaScript syntax
        run: node --check server.js

      - name: Compile data scripts
        run: python -m py_compile scripts/build_regional_catalog.py scripts/fuse_regional_catalog.py scripts/test_regional_catalog.py

      - name: Run JavaScript tests
        run: npm test

      - name: Run Yemen regional catalog tests
        run: python scripts/test_regional_catalog.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Android debug APK
        run: gradle --no-daemon :android:app:assembleDebug
