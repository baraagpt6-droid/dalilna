name: Dalilna 3.1.0 quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - feat/dalilna-v2.7.0-national-classifier-search-ux
    paths:
      - 'index.html'
      - 'server.js'
      - 'category-mapping.json'
      - 'scripts/**'
      - 'tests/**'
      - 'android/**'
      - 'package.json'
      - '.github/workflows/pr-quality.yml'

permissions:
  contents: read

concurrency:
  group: dalilna-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Node.js dependencies
        run: npm install --no-audit --no-fund

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Google Play image tooling
        run: python -m pip install "Pillow>=11,<13" "CairoSVG>=2.8,<3"

      - name: Compile and test Google Play draft and asset tooling
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/google_play_closed_testing_draft.py scripts/prepare_google_play_assets.py scripts/test_google_play_assets.py scripts/test_google_play_closed_testing_draft.py
          python scripts/test_google_play_assets.py
          python scripts/test_google_play_closed_testing_draft.py
          cat scripts/gp-capture-a.part scripts/gp-capture-b2.part scripts/gp-capture-c.part scripts/gp-capture-d.part scripts/gp-capture-d2.part > scripts/capture.cjs
          node --check scripts/capture.cjs


      - name: Build compressed full-Yemen search index
        run: python scripts/build_search_index_light.py --catalog-dir regional-catalog --output regional-catalog/search_index_light.json

      - name: Verify compressed search index
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path("regional-catalog/search_index_light.json")
          payload=json.loads(path.read_text(encoding="utf-8"))
          assert path.stat().st_size <= 1_500_000
          assert payload.get("recordCount",0)>0
          assert payload.get("encoding") == "gzip+base64"
          print("National search index:", payload["recordCount"], "records,", path.stat().st_size, "bytes")
          PY

      - name: Sync PWA and national catalogue into Android assets
        shell: bash
        run: |
          mkdir -p android/app/src/main/assets/icons android/app/src/main/assets/regional-catalog android/app/src/main/assets/market-price-images
          cp index.html app-native-bridge.js app-update.js market-price-guide.js market-price-guide.css market_prices_yemen.json regional-catalog-runtime.js marketplace-client.js features-2.1.js features-2.1.css v3.0.0.js v3.0.0.css jobs-feed.json manifest.json version.json sw.js regions-yemen.js regions-profiles.js privacy.html terms.html android/app/src/main/assets/
          cp icons/* android/app/src/main/assets/icons/
          cp market-price-images/*.svg android/app/src/main/assets/market-price-images/
          cp regional-catalog/*.json android/app/src/main/assets/regional-catalog/
          for name in index.html app-native-bridge.js app-update.js market-price-guide.js market-price-guide.css market_prices_yemen.json sw.js marketplace-client.js manifest.json version.json jobs-feed.json v3.0.0.js v3.0.0.css; do
            cmp -s "$name" "android/app/src/main/assets/$name" || { echo "$name asset is stale"; exit 1; }
          done
          cmp -s regions-yemen.js android/app/src/main/assets/regions-yemen.js
          for image in market-price-images/*.svg; do
            cmp -s "$image" "android/app/src/main/assets/$image" || { echo "$image asset is stale"; exit 1; }
          done
          cmp -s regional-catalog/search_index_light.json android/app/src/main/assets/regional-catalog/search_index_light.json

      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check v3.0.0.js
          node --check features-2.1.js

      - name: Compile data scripts
        run: python -m py_compile scripts/build_regional_catalog.py scripts/fuse_regional_catalog.py scripts/test_regional_catalog.py scripts/build_search_index_light.py tests/test_search_index_light.py

      - name: Test compressed national search-index generator
        run: python tests/test_search_index_light.py

      - name: Run JavaScript tests
        run: npm test

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run real-browser profile, shop and favourites journey
        run: npm run test:e2e

      - name: Run Yemen regional catalog tests
        run: python scripts/test_regional_catalog.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Android debug APK
        run: gradle --no-daemon :android:app:assembleDebug

      - name: Verify Android debug APK artifact
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"

      - name: Launch Dalilna on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2.34.0
        env:
          # Hosted runners without KVM need the Android Emulator's explicit
          # opt-in for TCG software CPU emulation.
          ANDROID_I_WANT_MY_TCG: "yes"
        with:
          working-directory: ${{ github.workspace }}
          api-level: 35
          emulator-boot-timeout: 1200
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -euo pipefail
            APK="android/app/build/outputs/apk/debug/app-debug.apk"
            if [[ ! -s "$APK" ]]; then
              echo "Debug APK not found from emulator working directory: $PWD"
              echo "Available workspace APK files:"
              find . -path "*/outputs/apk/*/*.apk" -type f -print | head -50
              exit 1
            fi
            mkdir -p artifacts/android-emulator
            adb wait-for-device
            adb logcat -c
            adb install -r "$APK"
            adb shell monkey -p ye.dalilna.app.debug 1
            launched=false
            for attempt in $(seq 1 30); do
              if adb shell pidof ye.dalilna.app.debug >/dev/null 2>&1; then
                launched=true
                break
              fi
              sleep 2
            done
            [[ "$launched" == "true" ]]
            adb shell screencap -p /sdcard/dalilna-home.png
            adb pull /sdcard/dalilna-home.png artifacts/android-emulator/dalilna-home.png
            adb logcat -d -t 4000 > artifacts/android-emulator/logcat.txt
            if grep -E "FATAL EXCEPTION|Fatal signal" artifacts/android-emulator/logcat.txt; then
              echo "Android emulator logged a fatal application/runtime error."
              exit 1
            fi
            test -s artifacts/android-emulator/dalilna-home.png

      - name: Upload Android Emulator smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dalilna-android-emulator-smoke
          path: artifacts/android-emulator/
          if-no-files-found: ignore
