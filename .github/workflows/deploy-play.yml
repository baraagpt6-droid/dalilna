name: Deploy to Google Play

on:
  workflow_dispatch:
    inputs:
      track:
        description: Google Play release track
        required: true
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
        default: internal

permissions:
  contents: read
  id-token: write

concurrency:
  group: dalilna-google-play-deploy
  cancel-in-progress: false

env:
  PACKAGE_NAME: "ye.dalilna.app"
  DALILNA_VERSION_CODE_BASE: "3127700"

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID || vars.ADMOB_APP_ID }}
      ADMOB_BANNER_AD_UNIT_ID: ${{ secrets.ADMOB_BANNER_AD_UNIT_ID || vars.ADMOB_BANNER_AD_UNIT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate repository, package ID, and required credentials
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "baraagpt6-droid/dalilna" ]] || {
            echo "::error::This workflow is restricted to baraagpt6-droid/dalilna."
            exit 1
          }
          APP_ID="$(sed -n 's/^[[:space:]]*applicationId = "\([^"]*\)"/\1/p' android/app/build.gradle.kts | head -n 1)"
          [[ "$APP_ID" == "$PACKAGE_NAME" ]] || {
            echo "::error::PACKAGE_NAME does not match android/app/build.gradle.kts applicationId."
            exit 1
          }

          missing=()
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD ADMOB_APP_ID ADMOB_BANNER_AD_UNIT_ID; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf '::error::Missing required GitHub Actions secrets/variables: %s\n' "$(IFS=', '; echo "${missing[*]}")"
            exit 1
          fi

          [[ "$ADMOB_APP_ID" =~ ^ca-app-pub-[0-9]{16}~[0-9]{10}$ ]] || {
            echo "::error::ADMOB_APP_ID is not a valid AdMob application ID."
            exit 1
          }
          [[ "$ADMOB_BANNER_AD_UNIT_ID" =~ ^ca-app-pub-[0-9]{16}/[0-9]{10}$ ]] || {
            echo "::error::ADMOB_BANNER_AD_UNIT_ID is not a valid AdMob banner unit ID."
            exit 1
          }

      - name: Decode and validate Android release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          KEYSTORE_FILE="$RUNNER_TEMP/dalilna-upload-keystore.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          chmod 600 "$KEYSTORE_FILE"
          keytool -list -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1 || {
            echo "::error::The supplied keystore, password, or alias could not be validated."
            exit 1
          }
          echo "ANDROID_KEYSTORE_FILE=$KEYSTORE_FILE" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build signed Android App Bundle
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :android:app:bundleRelease
          AAB_PATH="android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB_PATH"
          echo "AAB_PATH=$AAB_PATH" >> "$GITHUB_ENV"

      - name: Authenticate to Google Cloud using Workload Identity Federation
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/28058491662/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "dalilna-play-automation@dalilna-play-automation-516000.iam.gserviceaccount.com"
          create_credentials_file: true
          export_environment_variables: true

      - name: Upload draft release to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ steps.auth.outputs.credentials_file_path }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track || 'internal' }}
          status: draft

      - name: Summarize deployment
        if: success()
        shell: bash
        run: |
          {
            echo "## Google Play draft uploaded"
            echo
            echo "- Package: $PACKAGE_NAME"
            echo "- Track: ${{ github.event.inputs.track || 'internal' }}"
            echo "- Release status: draft"
            echo "- Version code: $((DALILNA_VERSION_CODE_BASE + GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))"
            echo "- Production rollout: not performed"
          } >> "$GITHUB_STEP_SUMMARY"
