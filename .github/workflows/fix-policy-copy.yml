name: Fix policy copy
on:
  pull_request:
    types: [synchronize]
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: ${{ github.head_ref }}}
      - run: node scripts/fix-play-policy-wording.cjs && rm -f .github/workflows/apply-google-play-pack-pr.yml .github/workflows/fix-policy-copy.yml scripts/fix-play-policy-wording.cjs test-arabic.md play-release-handoff.txt && git config user.name github-actions\[bot\] && git config user.email 41898282+github-actions\[bot\]@users.noreply.github.com && git add -A && git commit -m 'fix(play): remove temporary helpers and tidy policy contact' && git push origin HEAD
