name: Publish approved Dalilna Closed Testing release

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: Exact versionCode of the approved draft already staged on Dalilna Closed Testing
        required: true
        type: string
      approval:
        description: Confirm promotion of this exact draft to Closed Testing
        required: true
        type: choice
        options:
          - "NO — keep draft"
          - "YES — publish approved draft to Closed Testing"
        default: "NO — keep draft"

permissions:
  contents: read
  id-token: write

concurrency:
  group: dalilna-approved-closed-test-release
  cancel-in-progress: false

jobs:
  publish_approved_release:
    if: ${{ inputs.approval == 'YES — publish approved draft to Closed Testing' }}
    name: Publish only the approved Closed Testing draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Dalilna main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Google authentication
        run: python -m pip install "google-auth>=2.40,<3" "requests>=2.32,<3"

      - name: Authenticate to Google Cloud using Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: "projects/28058491662/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "dalilna-play-automation@dalilna-play-automation-516000.iam.gserviceaccount.com"
          create_credentials_file: true
          export_environment_variables: true

      - name: Promote exact approved draft on Closed Testing only
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          APPROVED_VERSION_CODE: ${{ inputs.version_code }}
          APPROVAL: ${{ inputs.approval }}
        run: >-
          python scripts/publish_approved_release.py
          --version-code "$APPROVED_VERSION_CODE"
          --approval "$APPROVAL"

  keep_draft:
    if: ${{ inputs.approval != 'YES — publish approved draft to Closed Testing' }}
    name: No publish action requested
    runs-on: ubuntu-latest
    steps:
      - name: Confirm draft remains untouched
        run: |
          {
            echo "## Dalilna Play release"
            echo
            echo "- No publish approval was given."
            echo "- Any existing draft remains unchanged."
            echo "- Production was not touched."
          } >> "$GITHUB_STEP_SUMMARY"
