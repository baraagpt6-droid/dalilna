name: Deploy Dalilna PWA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'marketplace-client.js'
      - 'privacy.html'
      - 'terms.html'
      - 'manifest.json'
      - 'sw.js'
      - 'regions-yemen.js'
      - 'regions-profiles.js'
      - 'icons/**'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: \${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare website files
        run: |
          mkdir -p _site/icons
          cp index.html marketplace-client.js manifest.json sw.js regions-yemen.js regions-profiles.js privacy.html terms.html _site/
          cp icons/* _site/icons/
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/marketplace-client.js
      - name: Upload PWA files
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-\${{ github.run_id }}-\${{ github.run_attempt }}
          path: _site
      - name: Wait for Pages artifact registration
        run: sleep 5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-\${{ github.run_id }}-\${{ github.run_attempt }}
