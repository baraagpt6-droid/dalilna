name: Deploy Dalilna PWA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app-native-bridge.js'
      - 'app-update.js'
      - 'market-price-guide.js'
      - 'market-price-guide.css'
      - 'market_prices_yemen.json'
      - 'market-price-images/**'
      - 'market-price-images/**'
      - 'regional-catalog-runtime.js'
      - 'marketplace-client.js'
      - 'features-2.1.js'
      - 'features-2.1.css'
      - 'v3.0.0.js'
      - 'v3.0.0.css'
      - 'jobs-feed.json'
      - 'privacy.html'
      - 'terms.html'
      - 'manifest.json'
      - 'market_items.json'
      - 'version.json'
      - 'sw.js'
      - 'regions-yemen.js'
      - 'regions-profiles.js'
      - 'regional-catalog/**'
      - 'icons/**'
      - 'netlify.toml'
      - 'scripts/build-netlify-site.cjs'
      - '.github/workflows/deploy-netlify.yml'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build compressed full-Yemen search index
        run: python3 scripts/build_search_index_light.py --catalog-dir regional-catalog --output regional-catalog/search_index_light.json
      - name: Prepare website files
        run: |
          mkdir -p _site/icons _site/regional-catalog _site/market-price-images
          cp index.html app-native-bridge.js app-update.js market-price-guide.js market-price-guide.css market_prices_yemen.json regional-catalog-runtime.js marketplace-client.js market_items.json features-2.1.js features-2.1.css v3.0.0.js v3.0.0.css jobs-feed.json manifest.json version.json sw.js regions-yemen.js regions-profiles.js privacy.html terms.html _site/
          cp icons/* _site/icons/
          cp market-price-images/*.svg _site/market-price-images/
          cp regional-catalog/*.json _site/regional-catalog/
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/marketplace-client.js
          test -s _site/features-2.1.js
          test -s _site/v3.0.0.js
          test -s _site/v3.0.0.css
          test -s _site/jobs-feed.json
      - name: Upload PWA files
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: _site
      - name: Wait for Pages artifact registration
        run: sleep 5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Smoke-test published homepage, styles and Yemen district catalogue
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.PAGE_URL;
          if (!base) throw new Error("GitHub Pages URL was not provided.");
          async function get(path) {
            let lastError;
            for (let attempt = 0; attempt < 5; attempt++) {
              try {
                const response = await fetch(new URL(path, base), { cache: "no-store" });
                if (response.ok) return response;
                lastError = new Error(path + " returned HTTP " + response.status);
              } catch (error) { lastError = error; }
              await new Promise(resolve => setTimeout(resolve, 2000));
            }
            throw lastError;
          }
          const [page, css, js, v3jsResponse, v3cssResponse, swResponse, manifestResponse, pwaManifestResponse, versionResponse, marketItemsResponse, lightIndexResponse, priceGuideResponse, priceGuideJsResponse, nativeBridgeResponse, appUpdateResponse, jobsFeedResponse] = await Promise.all([
            get("./index.html"),
            get("./features-2.1.css?v=3.1.0"),
            get("./features-2.1.js?v=3.1.0"),
            get("./v3.0.0.js?v=3.1.0"),
            get("./v3.0.0.css?v=3.1.0"),
            get("./sw.js"),
            get("./regional-catalog/manifest.json?v=3.1.0"),
            get("./manifest.json"),
            get("./version.json"),
            get("./market_items.json"),
            get("./regional-catalog/search_index_light.json?v=3.1.0"),
            get("./market_prices_yemen.json"),
            get("./market-price-guide.js?v=3.1.0"),
            get("./app-native-bridge.js?v=3.1.0"),
            get("./app-update.js?v=3.1.0"),
            get("./jobs-feed.json")
          ]);
          const html = await page.text();
          const manifest = await manifestResponse.json();
          const pwaManifest = await pwaManifestResponse.json();
          const version = await versionResponse.json();
          const marketItems = await marketItemsResponse.json();
          const priceGuide = await priceGuideResponse.json();
          const priceGuideJs = await priceGuideJsResponse.text();
          const nativeBridge = await nativeBridgeResponse.text();
          const appUpdate = await appUpdateResponse.text();
          const featureJsText = await js.text();
          const v3js = await v3jsResponse.text(), v3css = await v3cssResponse.text();
          const jobsFeed = await jobsFeedResponse.json();
          const lightBytes = await lightIndexResponse.arrayBuffer();
          const lightEnvelope = JSON.parse(new TextDecoder().decode(lightBytes));
          if (lightBytes.byteLength > 1500000 || lightEnvelope.encoding !== "gzip+base64") throw new Error("Full-Yemen light search index is too large or uncompressed.");
          const { gunzipSync } = await import("node:zlib");
          const lightPayload = JSON.parse(gunzipSync(Buffer.from(lightEnvelope.data, "base64")).toString("utf8"));
          if (!Array.isArray(lightPayload.i) || lightPayload.i.length !== manifest.totalCount || lightEnvelope.recordCount !== manifest.totalCount) throw new Error("Full-Yemen search index is incomplete.");
          if (version.webVersion !== "3.1.0" || version.version !== "3.1.0" || Number(version.versionCode) < 3100000 || Number(version.androidVersionCode) < 3100000 || version.androidSigningMode !== "persistent") throw new Error("version.json does not describe the persistent Dalilna 3.1.0 release.");
          if (version.officialWebUrl !== base || pwaManifest.id !== base || pwaManifest.version !== "3.1.0" || !html.includes(`<link rel="canonical" href="${base}">`)) throw new Error("Official canonical URL, PWA manifest identity or OTA metadata does not match GitHub Pages.");
          if (!html.includes('content="3.1.0"')) throw new Error("Deployed homepage version is not 3.1.0.");
          if (!(await css.text()).includes(".quick-jump-btn")) throw new Error("Quick-access stylesheet was not published.");
          if (!featureJsText.includes("officialApplicationUrl")) throw new Error("Feature JavaScript is incomplete.");
          if (!(await swResponse.text()).includes("v3.1.0")) throw new Error("Updated service worker was not published.");
          if (!v3js.includes("dalilna:favorite-change") || !v3js.includes("cubic-bezier") || !v3css.includes(".v3-favorite-trigger")) throw new Error("Saved hub and fly-to-favorites assets are incomplete.");
          if (!Array.isArray(jobsFeed.items) || !featureJsText.includes("jobsInlineSearch") || !featureJsText.includes("jobsSavedFilter")) throw new Error("Job search, saved filter or local jobs feed is unavailable.");
          if (!v3js.includes("savedHubDialog") || !v3js.includes("profileSavedHub")) throw new Error("Unified favorites hub is incomplete.");
          if (!Array.isArray(marketItems.items) || marketItems.items.length !== 0 || !marketItems.groupNames || marketItems.groupNames.length !== 7) throw new Error("Marketplace must not publish synthetic reference listings.");
          if (!Array.isArray(priceGuide.items) || priceGuide.items.length < 10 || priceGuide.updateFrequencyDays !== 7) throw new Error("Weekly reference price guide is incomplete.");
          for (const item of priceGuide.items) {
            if (!item.sourceUrl?.startsWith("https://") || !item.image || !(await fetch(new URL("./market-price-images/" + item.image, base))).ok) throw new Error("A market-price card is missing its source or local illustration: " + item.id);
          }
          if (!priceGuideJs.includes("DalilnaPriceGuide") || !nativeBridge.includes("switchToRemote") || !appUpdate.includes("androidVersionCode")) throw new Error("Price guide, OTA bridge or update notice was not published.");
          if (Number(version.androidVersionCode) > 280 && !version.androidReleaseUrl?.startsWith("https://")) throw new Error("A published Android update is missing its release URL.");
          if (!Array.isArray(manifest.governorates) || manifest.governorates.length !== 22) throw new Error("Published regional manifest does not contain all 22 governorates.");
          if (!Array.isArray(manifest.districtCounts) || manifest.districtCounts.length !== 335) throw new Error("Published regional manifest does not contain all 335 districts.");
          const governorateTotal = manifest.governorates.reduce((sum, item) => sum + Number(item.count || 0), 0);
          const districtTotal = manifest.districtCounts.reduce((sum, item) => sum + Number(item.count || 0), 0);
          const unassignedCount = Number(manifest.unassignedCount || 0);
          if (!Number.isInteger(Number(manifest.totalCount)) || Number(manifest.totalCount) < 1) throw new Error("Published regional manifest has an invalid total count.");
          if (governorateTotal !== Number(manifest.totalCount)) throw new Error("Governorate totals do not match the national catalogue total.");
          if (districtTotal + unassignedCount !== Number(manifest.totalCount)) throw new Error("District and unassigned totals do not match the national catalogue total.");
          console.log(JSON.stringify({ page: base, version: "3.1.0", signingMode: version.androidSigningMode, androidVersionCode: version.androidVersionCode, jobs: jobsFeed.items.length, governorates: manifest.governorates.length, districtRows: manifest.districtCounts.length, places: manifest.totalCount, marketplaceReferenceItems: marketItems.items.length, marketplaceGroups: marketItems.groupNames.length, nationalSearchRecords: lightPayload.i.length, lightSearchBytes: lightBytes.byteLength }, null, 2));
          NODE
