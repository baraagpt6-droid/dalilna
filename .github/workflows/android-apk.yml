name: Build Dalilna Android APK and signed Play AAB
# The persistent release keystore is supplied only through repository Actions secrets.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app-native-bridge.js'
      - 'app-update.js'
      - 'market-price-guide.js'
      - 'market-price-guide.css'
      - 'market-price-images/**'
      - 'regional-catalog-runtime.js'
      - 'marketplace-client.js'
      - 'features-2.1.js'
      - 'features-2.1.css'
      - 'v3.0.0.js'
      - 'v3.0.0.css'
      - 'jobs-feed.json'
      - 'privacy.html'
      - 'terms.html'
      - 'manifest.json'
      - 'market_items.json'
      - 'sw.js'
      - 'regions-yemen.js'
      - 'regions-profiles.js'
      - 'regional-catalog/**'
      - 'DATA_SOURCES.md'
      - 'icons/**'
      - 'android/**'
      - 'GOOGLE_PLAY_DATA_SAFETY.md'
      - '!android/app/src/main/assets/version.json'
      - 'tests/**'
      - 'api/**'
      - 'db/**'
      - 'scripts/**'
      - 'server.js'
      - 'marketplace-api.js'
      - 'package.json'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: dalilna-v3.1.0-android-release
  cancel-in-progress: false

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      # AdMob identifiers are public app configuration values, not credentials.
      ADMOB_APP_ID: ca-app-pub-7435095568109483~2348618581
      ADMOB_BANNER_AD_UNIT_ID: ca-app-pub-7435095568109483/4522200831
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Node.js dependencies
        run: npm install

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Configure required persistent Android signing key
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          secret_names=(
            ANDROID_KEYSTORE_BASE64
            ANDROID_KEYSTORE_PASSWORD
            ANDROID_KEY_ALIAS
            ANDROID_KEY_PASSWORD
          )
          present=0
          for name in "${secret_names[@]}"; do
            if [[ -n "${!name:-}" ]]; then
              present=$((present + 1))
            fi
          done

          if [[ "$present" -ne 4 ]]; then
            echo "::error::All four persistent Android signing secrets are required for Dalilna 3.1.0."
            exit 1
          fi
          KEYSTORE="$RUNNER_TEMP/dalilna-persistent.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null
          echo "ANDROID_KEYSTORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "mode=persistent" >> "$GITHUB_OUTPUT"
          echo "Persistent Android signing key configured."

      - name: Build compressed full-Yemen search index
        run: python3 scripts/build_search_index_light.py --catalog-dir regional-catalog --output regional-catalog/search_index_light.json

      - name: Prepare Android OTA metadata before packaging
        env:
          APK_SIGNING_MODE: ${{ steps.signing.outputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require("node:fs");
          const file = "version.json";
          const runNumber = Number(process.env.GITHUB_RUN_NUMBER);
          const attempt = Number(process.env.GITHUB_RUN_ATTEMPT || 1);
          const versionCode = 3100000 + runNumber * 100 + attempt;
          if (!Number.isSafeInteger(versionCode) || versionCode <= 0) throw new Error("Invalid Android OTA versionCode");
          const version = JSON.parse(fs.readFileSync(file, "utf8"));
          version.version = "3.1.0";
          version.webVersion = "3.1.0";
          version.androidVersion = "3.1.0";
          version.versionCode = versionCode;
          version.androidVersionCode = versionCode;
          version.androidSigningMode = process.env.APK_SIGNING_MODE || "persistent";
          version.androidReleaseUrl = "https://github.com/" + process.env.GITHUB_REPOSITORY + "/releases/download/v3.1.0/app-release.apk";
          version.officialWebUrl = "https://baraagpt6-droid.github.io/dalilna/";
          version.updatedAt = new Date().toISOString();
          fs.writeFileSync(file, JSON.stringify(version, null, 2));
          NODE

      - name: Sync PWA, OTA bridge, price guide and Yemen catalogue into Android assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/assets/icons android/app/src/main/assets/regional-catalog android/app/src/main/assets/market-price-images
          cp index.html app-native-bridge.js app-update.js market-price-guide.js market-price-guide.css market_prices_yemen.json regional-catalog-runtime.js marketplace-client.js market_items.json features-2.1.js features-2.1.css v3.0.0.js v3.0.0.css jobs-feed.json manifest.json version.json sw.js regions-yemen.js regions-profiles.js privacy.html terms.html android/app/src/main/assets/
          cp icons/* android/app/src/main/assets/icons/
          cp market-price-images/*.svg android/app/src/main/assets/market-price-images/
          cp regional-catalog/*.json android/app/src/main/assets/regional-catalog/
          for name in index.html app-native-bridge.js app-update.js market-price-guide.js market-price-guide.css market_prices_yemen.json regional-catalog-runtime.js sw.js marketplace-client.js market_items.json features-2.1.js features-2.1.css v3.0.0.js v3.0.0.css jobs-feed.json manifest.json version.json; do
            cmp -s "$name" "android/app/src/main/assets/$name" || { echo "$name differs from the Android WebView asset"; exit 1; }
          done
          cmp -s v3.0.0.js android/app/src/main/assets/v3.0.0.js
          cmp -s v3.0.0.css android/app/src/main/assets/v3.0.0.css
          cmp -s regional-catalog/search_index_light.json android/app/src/main/assets/regional-catalog/search_index_light.json
          test -f android/app/src/main/assets/market-price-images/solar-panel.svg

      - name: Run application, market-guide and OTA checks
        run: npm test

      - name: Normalize and validate production AdMob identifiers
        id: release-ads
        shell: bash
        run: |
          set -euo pipefail
          app_id="$(printf '%s' "${ADMOB_APP_ID:-}" | tr -d '[:space:]')"
          banner_id="$(printf '%s' "${ADMOB_BANNER_AD_UNIT_ID:-}" | tr -d '[:space:]')"

          if [[ ! "$app_id" =~ ^ca-app-pub-[0-9]{16}~[0-9]{10}$ ]]; then
            echo "::error::ADMOB_APP_ID is not a valid production AdMob App ID."
            exit 1
          fi
          if [[ ! "$banner_id" =~ ^ca-app-pub-[0-9]{16}/[0-9]{10}$ ]]; then
            echo "::error::ADMOB_BANNER_AD_UNIT_ID is not a valid production banner Ad Unit ID."
            exit 1
          fi

          # Export the whitespace-normalized values for Gradle's Release build.
          {
            printf 'ADMOB_APP_ID=%s\n' "$app_id"
            printf 'ADMOB_BANNER_AD_UNIT_ID=%s\n' "$banner_id"
          } >> "$GITHUB_ENV"
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "Production AdMob identifiers validated and normalized."

      - name: Build signed Release APK and AAB
        if: steps.release-ads.outputs.ready == 'true'
        run: gradle --no-daemon :android:app:assembleRelease :android:app:bundleRelease

      - name: Verify signed Release AAB
        if: steps.release-ads.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          jarsigner -verify -verbose "$AAB" >/dev/null
          keytool -printcert -jarfile "$AAB" >/dev/null
          echo "Release AAB exists and its JAR signature verifies."

      - name: Verify APK version and signature
        if: steps.release-ads.outputs.ready == 'true'
        id: app-version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' android/app/build.gradle.kts | head -n 1)"
          VERSION_CODE="$((3100000 + GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))"
          APK="android/app/build/outputs/apk/release/app-release.apk"
          if [[ "$VERSION" != "3.1.0" ]]; then
            echo "Expected versionName 3.1.0, got $VERSION"
            exit 1
          fi
          test -s "$APK"

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$SDK_ROOT" || ! -d "$SDK_ROOT/build-tools" ]]; then
            echo "Android SDK build-tools were not found."
            exit 1
          fi
          BUILD_TOOLS_VERSION="$(ls -1 "$SDK_ROOT/build-tools" | sort -V | tail -n 1)"
          BUILD_TOOLS="$SDK_ROOT/build-tools/$BUILD_TOOLS_VERSION"
          ACTUAL_PACKAGE_NAME="$("$BUILD_TOOLS/aapt" dump badging "$APK" | awk -F"'" '/^package: name=/{print $2; exit}')"
          if [[ "$ACTUAL_PACKAGE_NAME" != "ye.dalilna.app" ]]; then
            echo "APK applicationId $ACTUAL_PACKAGE_NAME does not match the production package ye.dalilna.app."
            exit 1
          fi
          ACTUAL_VERSION_CODE="$("$BUILD_TOOLS/aapt" dump badging "$APK" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -n 1)"
          if [[ "$ACTUAL_VERSION_CODE" != "$VERSION_CODE" ]]; then
            echo "APK versionCode $ACTUAL_VERSION_CODE does not match expected $VERSION_CODE."
            exit 1
          fi

          EMBEDDED_VERSION_JSON="$(unzip -p "$APK" assets/version.json)"
          EMBEDDED_VERSION_CODE="$(printf '%s' "$EMBEDDED_VERSION_JSON" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(String(JSON.parse(s).androidVersionCode||0)))')"
          if [[ "$EMBEDDED_VERSION_CODE" != "$VERSION_CODE" ]]; then
            echo "Embedded OTA versionCode $EMBEDDED_VERSION_CODE does not match APK versionCode $VERSION_CODE."
            exit 1
          fi

          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" >/dev/null 2>&1
          echo "APK signing mode: ${{ steps.signing.outputs.mode }}"
          echo "APK signature verification passed."
          echo "version=3.1.0" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Upload APK workflow artifact
        if: steps.release-ads.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dalilna-3.1.0-android-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload signed AAB workflow artifact
        if: steps.release-ads.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dalilna-3.1.0-android-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK and signed AAB to GitHub Releases
        if: steps.release-ads.outputs.ready == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.1.0
          name: Dalilna 3.1.0 Android APK + signed AAB
          prerelease: false
          make_latest: true
          overwrite_files: true
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          body: |
            Dalilna 3.1.0 Android release artifacts.
            Signing mode: ${{ steps.signing.outputs.mode }}
            versionCode: ${{ steps.app-version.outputs.version_code }}
            Official web app: https://baraagpt6-droid.github.io/dalilna/

            With all four persistent signing secrets configured, this APK uses the persistent Dalilna keystore for in-place updates.
            Persistent signing is mandatory for this release.
            The signed AAB is intended for Google Play Console review. Check the Data safety worksheet before submission.

      - name: Publish exact Android versionCode for OTA clients
        if: steps.release-ads.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          APK_VERSION_CODE: ${{ steps.app-version.outputs.version_code }}
          APK_SIGNING_MODE: ${{ steps.signing.outputs.mode }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pushed=false
          for attempt in 1 2 3 4; do
            # Rebase the metadata-only change onto the newest main commit so
            # concurrent audit/catalogue publications cannot drop the APK code.
            git fetch origin main
            git reset --hard origin/main
            node - <<'NODE'
          const fs = require("node:fs");
          const file = "version.json";
          const v = JSON.parse(fs.readFileSync(file, "utf8"));
          v.version = "3.1.0";
          v.webVersion = "3.1.0";
          v.androidVersion = "3.1.0";
          const versionCode = Number(process.env.APK_VERSION_CODE);
          if (!Number.isSafeInteger(versionCode) || versionCode <= 0) throw new Error("Invalid APK versionCode");
          v.versionCode = versionCode;
          v.androidVersionCode = versionCode;
          v.androidSigningMode = process.env.APK_SIGNING_MODE;
          v.androidReleaseUrl = "https://github.com/" + process.env.GITHUB_REPOSITORY + "/releases/download/v3.1.0/app-release.apk";
          v.officialWebUrl = "https://baraagpt6-droid.github.io/dalilna/";
          v.updatedAt = new Date().toISOString();
          fs.writeFileSync(file, JSON.stringify(v, null, 2));
          fs.copyFileSync(file, "android/app/src/main/assets/version.json");
          NODE
            git add version.json android/app/src/main/assets/version.json
            if git diff --cached --quiet; then
              echo "OTA metadata already matches the published APK."
              pushed=true
              break
            fi
            git commit -m "chore(release): publish v3.1.0 Android update code"
            if git push origin HEAD:main; then
              pushed=true
              break
            fi
            echo "Concurrent main update detected on attempt $attempt; retrying with latest main."
          done
          if [[ "$pushed" != "true" ]]; then
            echo "::error::Could not publish Android OTA metadata after four attempts."
            exit 1
          fi

      - name: Trigger GitHub Pages refresh with the published OTA versionCode
        if: steps.release-ads.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/deploy-pages.yml/dispatches" \
            -d '{"ref":"main"}'
