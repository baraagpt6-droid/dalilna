name: Build Dalilna Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'regional-catalog-runtime.js'
      - 'marketplace-client.js'
      - 'features-2.1.js'
      - 'features-2.1.css'
      - 'jobs-feed.json'
      - 'privacy.html'
      - 'terms.html'
      - 'manifest.json'
      - 'sw.js'
      - 'regions-yemen.js'
      - 'regions-profiles.js'
      - 'regional-catalog/**'
      - 'DATA_SOURCES.md'
      - 'icons/**'
      - 'android/**'
      - 'tests/**'
      - 'api/**'
      - 'db/**'
      - 'scripts/**'
      - 'server.js'
      - 'marketplace-api.js'
      - 'package.json'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Sync PWA and regional catalogue into Android WebView assets
        shell: bash
        run: |
          mkdir -p android/app/src/main/assets/icons android/app/src/main/assets/regional-catalog
          cp index.html regional-catalog-runtime.js marketplace-client.js features-2.1.js features-2.1.css jobs-feed.json manifest.json sw.js regions-yemen.js regions-profiles.js privacy.html terms.html android/app/src/main/assets/
          cp icons/* android/app/src/main/assets/icons/
          cp regional-catalog/*.json android/app/src/main/assets/regional-catalog/
          cmp -s index.html android/app/src/main/assets/index.html
          cmp -s regional-catalog-runtime.js android/app/src/main/assets/regional-catalog-runtime.js
          cmp -s sw.js android/app/src/main/assets/sw.js
          cmp -s marketplace-client.js android/app/src/main/assets/marketplace-client.js
          cmp -s features-2.1.js android/app/src/main/assets/features-2.1.js
          cmp -s features-2.1.css android/app/src/main/assets/features-2.1.css
          cmp -s jobs-feed.json android/app/src/main/assets/jobs-feed.json
      - name: Test application and shared marketplace validation
        run: npm test
      - name: Build signed debug APK
        run: gradle --no-daemon :android:app:assembleDebug
      - name: Read Android app version
        id: app-version
        shell: bash
        run: |
          VERSION="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' android/app/build.gradle.kts | head -n 1)"
          if [ -z "$VERSION" ]; then
            echo "Unable to read Android versionName."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dalilna-${{ steps.app-version.outputs.version }}-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK as a GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.app-version.outputs.version }}
          name: Dalilna ${{ steps.app-version.outputs.version }} Android APK (Testing)
          prerelease: true
          make_latest: false
          files: android/app/build/outputs/apk/debug/app-debug.apk
          body: |
            Dalilna ${{ steps.app-version.outputs.version }} testing APK with the Yemen regional places catalogue.
            Shared marketplace requires PostgreSQL setup on Render.
            This is a debug-signed test build, not a Play Store production release.
