name: Refresh Yemen and Gulf jobs feed

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/refresh-jobs.cjs"
      - ".github/workflows/refresh-jobs.yml"

permissions:
  contents: write

concurrency:
  group: dalilna-jobs-feed
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Refresh public job sources
        env:
          RELIEFWEB_APPNAME: ${ secrets.RELIEFWEB_APPNAME }}
          DALILNA_JOB_RSS_FEEDS: ${ vars.DALILNA_JOB_RSS_FEEDS }}
        run: node scripts/refresh-jobs.cjs
      - name: Commit refreshed feed when it changes
        shell: bash
        run: |
          if git diff --quiet -- jobs-feed.json; then
            echo "No new job-feed data to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs-feed.json
          git commit -m "data: refresh Yemen and Gulf jobs feed"
          git push origin HEAD:main
