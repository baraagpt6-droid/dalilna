name: Daily merchant, marketplace and live-data sync

on:
  workflow_dispatch:
  schedule:
    - cron: "30 */6 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/daily-sync.cjs"
      - "scripts/refresh-marketplace-products.cjs"
      - "marketplace-api.js"
      - ".github/workflows/daily-sync.yml"

permissions:
  contents: read

concurrency:
  group: dalilna-daily-sync
  cancel-in-progress: false

jobs:
  daily-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install application dependencies
        run: npm install
      - name: Check live exchange, jobs and marketplace services; sync configured merchant products
        env:
          DALILNA_API_BASE_URL: https://dalilna-live.onrender.com
          DALILNA_PRODUCT_FEED_URLS: ${{ vars.DALILNA_PRODUCT_FEED_URLS }}
          DALILNA_PRODUCT_SYNC_TOKEN: ${{ secrets.DALILNA_PRODUCT_SYNC_TOKEN }}
        shell: bash
        run: |
          set +e
          log_file="$(mktemp)"
          node scripts/daily-sync.cjs 2>&1 | tee "$log_file"
          status=${PIPESTATUS[0]}
          set -e

          if [[ "$status" -eq 0 ]]; then
            exit 0
          fi

          # The app hides stale exchange quotes. Treat only that known upstream
          # feed condition as a warning; every other sync failure still fails CI.
          node - "$log_file" <<'NODE'
          const fs = require("node:fs");
          const lines = fs.readFileSync(process.argv[2], "utf8").trim().split(/\r?\n/);
          let summary = null;
          for (let i = lines.length - 1; i >= 0; i--) {
            try {
              const parsed = JSON.parse(lines[i]);
              if (parsed && parsed.event === "daily_sync.completed") {
                summary = parsed;
                break;
              }
            } catch (_) {}
          }
          if (!summary || !summary.results) process.exit(1);
          const failed = Object.entries(summary.results).filter(([, value]) => value && value.ok === false);
          const staleExchangeOnly =
            failed.length === 1 &&
            failed[0][0] === "exchange" &&
            failed[0][1].error === "Exchange feed is stale or lacks current USD, SAR and 21K gold buy/sell quotes." &&
            summary.results.services?.marketplaceReady === true &&
            summary.results.products?.ok !== false;
          if (!staleExchangeOnly) process.exit(1);
          console.log("::warning::The upstream exchange feed is stale. Dalilna hides stale quotes; marketplace, jobs and configured product checks passed.");
          NODE
          rm -f "$log_file"
