name: Daily merchant, marketplace and live-data sync

on:
  workflow_dispatch:
  schedule:
    - cron: "30 */6 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/daily-sync.cjs"
      - "scripts/refresh-marketplace-products.cjs"
      - "marketplace-api.js"
      - ".github/workflows/daily-sync.yml"

permissions:
  contents: read

concurrency:
  group: dalilna-daily-sync
  cancel-in-progress: false

jobs:
  daily-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install application dependencies
        run: npm install
      - name: Check live exchange, jobs and marketplace services; sync configured merchant products
        env:
          DALILNA_API_BASE_URL: https://dalilna-live.onrender.com
          DALILNA_PRODUCT_FEED_URLS: ${{ vars.DALILNA_PRODUCT_FEED_URLS }}
          DALILNA_PRODUCT_SYNC_TOKEN: ${{ secrets.DALILNA_PRODUCT_SYNC_TOKEN }}
        run: node scripts/daily-sync.cjs
