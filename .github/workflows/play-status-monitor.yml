name: Dalilna Google Play Status Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "30 23 * * *" # 07:30 Asia/Kuala_Lumpur
  push:
    branches:
      - main
    paths:
      - ".github/workflows/play-status-monitor.yml"
      - "scripts/play_status_monitor.py"
      - "scripts/test_play_status_monitor.py"

permissions:
  contents: read
  id-token: write

concurrency:
  group: dalilna-play-status-monitor
  cancel-in-progress: false

jobs:
  inspect-play:
    name: Read Dalilna Play state through WIF
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Dalilna main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Google authentication
        run: python -m pip install "google-auth>=2.40,<3" "requests>=2.32,<3"

      - name: Test monitor logic without network access
        run: python -m unittest discover -s scripts -p "test_play_status_monitor.py" -v

      - name: Authenticate with Google Cloud using Workload Identity Federation
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: "projects/28058491662/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "dalilna-play-automation@dalilna-play-automation-516000.iam.gserviceaccount.com"
          create_credentials_file: true
          export_environment_variables: true

      - name: Inspect committed Play tracks and summarize in Arabic
        env:
          PACKAGE_NAME: "ye.dalilna.app"
        run: python scripts/play_status_monitor.py
