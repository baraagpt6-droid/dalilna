name: Refresh Yemen regional places catalogue

on:
  workflow_dispatch:
  schedule:
    - cron: "20 2 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/build_regional_catalog.py"
      - "scripts/test_regional_catalog.py"
      - "category-mapping.json"
      - "regions-yemen.js"
      - ".github/workflows/refresh-regional-catalog.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: dalilna-regional-catalog
  cancel-in-progress: false

jobs:
  build-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Install Osmium
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool
          osmium --version
      - name: Download current open datasets
        run: |
          GEOFABRIK_BASE="https://download.geofabrik.de/asia"
          if ! curl -fL --retry 4 --retry-delay 3 "$GEOFABRIK_BASE/yemen-latest.osm.pbf" -o yemen-latest.osm.pbf \
            || [[ ! -s yemen-latest.osm.pbf ]] \
            || [[ "$(stat -c%s yemen-latest.osm.pbf)" -lt 1000000 ]]; then
            echo "Latest Geofabrik Yemen extract is unavailable or invalid; resolving the newest dated snapshot."
            curl -fL --retry 4 --retry-delay 3 "$GEOFABRIK_BASE/yemen.html" -o yemen-index.html
            SNAPSHOT="$(python3 scripts/resolve_geofabrik_snapshot.py < yemen-index.html)"
            test -n "$SNAPSHOT"
            echo "Using the newest available Geofabrik snapshot: $SNAPSHOT"
            curl -fL --retry 4 --retry-delay 3 "$GEOFABRIK_BASE/$SNAPSHOT" -o yemen-latest.osm.pbf
          fi
          if [[ ! -s yemen-latest.osm.pbf ]] || [[ "$(stat -c%s yemen-latest.osm.pbf)" -lt 1000000 ]]; then
            echo "Geofabrik Yemen extract is missing or smaller than 1 MB; refusing to build from an invalid file."
            exit 1
          fi
          download_admin_file() {
            local name="$1"
            local api_url="https://api.github.com/repos/open-admin-data/yemen-administrative-divisions/contents/data/${name}?ref=master"
            local raw_url="https://raw.githubusercontent.com/open-admin-data/yemen-administrative-divisions/master/data/${name}"
            if ! curl -fL --retry 3 --retry-delay 2 -H "Accept: application/vnd.github.raw+json" "$api_url" -o "$name"; then
              echo "Contents API download failed for $name; using raw GitHub URL."
              curl -fL --retry 4 --retry-delay 3 "$raw_url" -o "$name"
            fi
          }
          download_admin_file all-governorate.json
          download_admin_file all-district.json
          test "$(stat -c%s yemen-latest.osm.pbf)" -gt 1000000
          test "$(stat -c%s all-governorate.json)" -gt 1000
          test "$(stat -c%s all-district.json)" -gt 100000
          python3 - <<'PY'
          import json
          for filename, expected in [("all-governorate.json", 22), ("all-district.json", 335)]:
              with open(filename, encoding="utf-8") as stream:
                  records = json.load(stream)
              if not isinstance(records, list) or len(records) != expected:
                  raise SystemExit(f"{filename}: expected {expected} records, got {len(records) if isinstance(records, list) else type(records).__name__}")
              print(filename, len(records))
          PY
      - name: Extract named public places
        run: |
          osmium tags-filter yemen-latest.osm.pbf \
            nwr/shop nwr/amenity nwr/healthcare nwr/tourism nwr/office \
            nwr/craft nwr/leisure nwr/public_transport nwr/emergency \
            nwr/delivery nwr/courier nwr/building=mosque \
            nwr/railway=station nwr/landuse=farmyard \
            -o places.osm.pbf
          osmium export places.osm.pbf -o places.geojson
          test -s places.geojson
      - name: Extract available administrative boundaries
        shell: bash
        run: |
          if osmium tags-filter yemen-latest.osm.pbf a/boundary=administrative -o boundaries.osm.pbf \
            && osmium export boundaries.osm.pbf -o boundaries.geojson; then
            echo "Administrative polygons extracted."
          else
            echo '{"type":"FeatureCollection","features":[]}' > boundaries.geojson
            echo "No administrative polygons; nearest-centroid assignments will be marked approximate."
          fi
      - name: Download geoBoundaries Yemen ADM2 polygons
        shell: bash
        run: |
          META_URL="https://www.geoboundaries.org/api/current/gbOpen/YEM/ADM2/"
          curl -fL --retry 4 --retry-delay 3 "$META_URL" -o geoboundaries-metadata.json
          GEOJSON_URL="$(python3 - <<'PY'
          import json
          with open("geoboundaries-metadata.json", encoding="utf-8") as stream:
              data = json.load(stream)
          url = data.get("gjDownloadURL")
          if not url or not url.startswith("https://"):
              raise SystemExit("geoBoundaries did not return a secure GeoJSON download URL")
          if data.get("boundaryType") != "ADM2" or data.get("boundaryISO") != "YEM":
              raise SystemExit("Unexpected administrative boundary metadata")
          if int(data.get("admUnitCount", 0)) != 335:
              raise SystemExit("Expected 335 Yemen ADM2 units")
          print(url)
          PY
          )"
          curl -fL --retry 4 --retry-delay 3 "$GEOJSON_URL" -o geoboundaries-yem-adm2.geojson
          python3 - <<'PY'
          import json
          with open("geoboundaries-yem-adm2.geojson", encoding="utf-8") as stream:
              payload = json.load(stream)
          features = payload.get("features", [])
          if len(features) != 335:
              raise SystemExit(f"Expected 335 Yemen ADM2 polygons, got {len(features)}")
          if not all((feature.get("geometry") or {}).get("type") in {"Polygon", "MultiPolygon"} for feature in features):
              raise SystemExit("ADM2 source contains invalid polygon geometry")
          print("geoBoundaries Yemen ADM2 polygons:", len(features))
          PY
      - name: Merge OSM and geoBoundaries administrative polygons
        run: |
          python3 - <<'PY'
          import json
          with open("boundaries.geojson", encoding="utf-8") as stream:
              osm = json.load(stream)
          with open("geoboundaries-yem-adm2.geojson", encoding="utf-8") as stream:
              admin = json.load(stream)
          features = list(osm.get("features", [])) + list(admin.get("features", []))
          with open("all-boundaries.geojson", "w", encoding="utf-8") as stream:
              json.dump({"type": "FeatureCollection", "features": features}, stream, ensure_ascii=False)
          print("Merged boundary features:", len(features))
          PY
      - name: Test and build the regional catalogue
        run: |
          python3 scripts/test_regional_catalog.py
          python3 scripts/build_regional_catalog.py \
            --places places.geojson \
            --boundaries all-boundaries.geojson \
            --governorates all-governorate.json \
            --districts all-district.json \
            --regions regions-yemen.js \
            --output regional-catalog
          python3 - <<'PY'
          import json
          with open("regional-catalog/manifest.json", encoding="utf-8") as f:
              data = json.load(f)
          assert data["totalCount"] > 0, "Refusing to publish an empty catalogue."
          assert len(data["governorates"]) == 22, "Expected all 22 governorates."
          assert data["license"] == "ODbL-1.0"
          assert len(data.get("districtCounts", [])) == 335, "Expected district counts for all 335 districts."
          assert data["districtCountTotal"] + data["unassignedCount"] == data["totalCount"]
          print("Catalogue records:", data["totalCount"])
          print("Governorates with places:", sum(1 for item in data["governorates"] if item["count"]))
          print("Districts with mapped records:", sum(1 for item in data["districtCounts"] if item["count"]))
          print("Polygon district assignments:", sum(item["boundaryCount"] for item in data["districtCounts"]))
          print("Approximate district assignments:", sum(item["approximateCount"] for item in data["districtCounts"]))
          PY
      - name: Publish catalogue and trigger web and Android builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -n "$(git status --porcelain -- regional-catalog)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add regional-catalog
            git commit -m "data: refresh Yemen regional places catalogue"
            git push origin main
            gh workflow run deploy-pages.yml --ref main
            gh workflow run android-apk.yml --ref main
            gh workflow run places-proxy-verification.yml --ref main
          else
            echo "The generated catalogue has no changes."
          fi
